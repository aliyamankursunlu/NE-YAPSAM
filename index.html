<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NE YAPSAM? · Sıkıldım · Ne Oynasam · Ne İzlesem · Ne Dinlesem</title>
<meta name="description" content="Tek uygulamada: ne oynasam, ne izlesem, ne dinlesem, ne yesem, mini oyunlar, öğrenci sayaçları, soru sistemi, gezi önerileri, notlar, avatar ve özetler. Tamamı tarayıcıda, verileriniz cihazınızda.">
<style>
/* ============ TEMA DEĞİŞKENLERİ ============ */
:root{
  --accent:#7c5cff; --accent2:#22d3ee; --accent3:#fbbf24;
  --ok:#34d399; --warn:#fbbf24; --bad:#fb7185; --info:#60a5fa;
  --r-sm:10px; --r:16px; --r-lg:22px; --r-xl:30px;
  --sp:14px;
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  --sh:0 10px 30px rgba(0,0,0,.35);
  --tr:.22s cubic-bezier(.4,0,.2,1);
}
html[data-theme="dark"]{
  --bg:#0b0d17; --bg2:#111426; --card:rgba(255,255,255,.055); --card-brd:rgba(255,255,255,.10);
  --card-hi:rgba(255,255,255,.09);
  --tx:#e9ecf5; --tx2:#a6adc8; --tx3:#6f7899;
  --input:rgba(0,0,0,.30); --shadow:0 12px 34px rgba(0,0,0,.45);
  --glow:0 0 0 1px rgba(124,92,255,.35), 0 8px 30px rgba(124,92,255,.18);
}
html[data-theme="light"]{
  --bg:#f4f6fc; --bg2:#ffffff; --card:rgba(255,255,255,.85); --card-brd:rgba(16,20,45,.10);
  --card-hi:rgba(255,255,255,.95);
  --tx:#141933; --tx2:#525c7d; --tx3:#8b93b0;
  --input:rgba(16,20,45,.05); --shadow:0 10px 26px rgba(30,40,80,.13);
  --glow:0 0 0 1px rgba(124,92,255,.28), 0 10px 26px rgba(124,92,255,.15);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:var(--font); color:var(--tx); background:var(--bg);
  background-image:
    radial-gradient(1100px 620px at 12% -8%, rgba(124,92,255,.20), transparent 60%),
    radial-gradient(900px 520px at 100% 0%, rgba(34,211,238,.14), transparent 55%),
    radial-gradient(700px 500px at 50% 110%, rgba(251,191,36,.10), transparent 60%);
  background-attachment:fixed;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; padding-bottom:96px;
}
body.big-text{font-size:17px}
h1,h2,h3,h4{margin:0 0 .4em; line-height:1.25}
h1{font-size:1.35rem} h2{font-size:1.12rem} h3{font-size:1rem}
p{margin:.3em 0 .6em}
a{color:var(--accent2); text-decoration:none}
a:hover{text-decoration:underline}
::selection{background:var(--accent); color:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}

/* ============ ÜST BAR ============ */
.app-header{position:sticky;top:0;z-index:40;backdrop-filter:blur(14px);background:linear-gradient(180deg,rgba(10,12,24,.92),rgba(10,12,24,.68));border-bottom:1px solid var(--card-brd)}
html[data-theme="light"] .app-header{background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.72))}
.hdr{display:flex;align-items:center;gap:12px;padding:9px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.brand .logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(135deg,var(--accent),#4b2ee0 60%,var(--accent2));box-shadow:0 6px 18px rgba(124,92,255,.45)}
.brand b{font-size:1.06rem;letter-spacing:.4px}
.brand small{display:block;font-size:.68rem;color:var(--tx2);letter-spacing:1.6px;text-transform:uppercase}
.hdr-spacer{flex:1 1 12px}
.hstats{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--card);
  border:1px solid var(--card-brd);font-size:.8rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill b{font-weight:700}
.pill.pts{background:linear-gradient(135deg,rgba(124,92,255,.30),rgba(34,211,238,.18));border-color:rgba(124,92,255,.45)}
.pill.streak{background:linear-gradient(135deg,rgba(251,191,36,.26),rgba(251,113,133,.14))}
.clock{font-family:var(--mono);font-weight:600;letter-spacing:.5px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--card-brd);background:var(--card);
  color:var(--tx);display:grid;place-items:center;cursor:pointer;font-size:17px;transition:var(--tr)}
.iconbtn:hover{background:var(--card-hi);transform:translateY(-1px)}
.iconbtn.on{background:linear-gradient(135deg,var(--accent),#5b3ce0);color:#fff;border-color:transparent}

/* ============ SEKMELER ============ */
.navbar{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:thin}
@media (min-width:980px){ .navbar{flex-wrap:wrap;overflow-x:visible} }   /* masaüstünde tüm sekmeler görünür */
.navbar::-webkit-scrollbar{height:6px}
.navbar::-webkit-scrollbar-thumb{background:var(--card-brd);border-radius:9px}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;
  border:1px solid var(--card-brd);background:var(--card);color:var(--tx2);font-size:.86rem;font-weight:600;
  cursor:pointer;transition:var(--tr);white-space:nowrap;position:relative}
.tab:hover{color:var(--tx);background:var(--card-hi);transform:translateY(-1px)}
.tab.active{color:#fff;background:linear-gradient(135deg,var(--accent),#4b2ee0);border-color:transparent;box-shadow:0 8px 22px rgba(124,92,255,.35)}
.tab .tb-emo{font-size:1.05rem}
.tab .pin{position:absolute;top:-3px;right:-3px;font-size:.62rem;background:var(--accent3);color:#20160a;
  border-radius:50%;width:15px;height:15px;display:grid;place-items:center;font-weight:800}
.quickbar{display:flex;gap:6px;align-items:center;padding:0 0 8px;flex-wrap:wrap;font-size:.76rem;color:var(--tx3)}
.quickbar .qt{padding:3px 9px;border-radius:999px;background:var(--card);border:1px dashed var(--card-brd);color:var(--tx2);cursor:pointer;font-size:.76rem}
.quickbar .qt:hover{color:var(--tx);border-style:solid}
.quickbar .qt .x{opacity:.5;margin-left:5px}
.quickbar .qt .x:hover{opacity:1;color:var(--bad)}

/* ============ GENEL YERLEŞİM ============ */
.view{display:none;animation:fade .28s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:18px 0 10px}
.sec-head .sh-ico{font-size:1.9rem;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.sec-head h2{margin:0}
.sec-head .sub{color:var(--tx2);font-size:.85rem;margin:0}
.grid{display:grid;gap:var(--sp);grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.grid.g2{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.grid.tight{gap:10px}
.card{background:var(--card);border:1px solid var(--card-brd);border-radius:var(--r-lg);padding:16px;
  backdrop-filter:blur(9px);box-shadow:var(--shadow)}
.card.pad-lg{padding:20px}
.card h3{display:flex;align-items:center;gap:8px;margin-bottom:.55em}
.card .hint{color:var(--tx3);font-size:.78rem}
.card.glow{box-shadow:var(--glow)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
.stack{display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--card-brd);font-size:.88rem}
.kv:last-child{border-bottom:0}
.kv span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.center{text-align:center}
.mt{margin-top:12px}.mt2{margin-top:22px}.mb{margin-bottom:12px}
.muted{color:var(--tx2)}
.tiny{font-size:.75rem}
.hidden{display:none !important}
.big-num{font-family:var(--mono);font-size:2.4rem;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
.big-num.small{font-size:1.5rem}

/* ============ BUTONLAR ============ */
.btn{border:1px solid var(--card-brd);background:var(--card);color:var(--tx);padding:9px 15px;border-radius:12px;
  font-size:.87rem;font-weight:650;cursor:pointer;transition:var(--tr);display:inline-flex;align-items:center;gap:7px;font-family:inherit}
.btn:hover{background:var(--card-hi);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--accent),#4b2ee0);color:#fff;border-color:transparent;box-shadow:0 8px 22px rgba(124,92,255,.32)}
.btn.cyan{background:linear-gradient(135deg,#0891b2,var(--accent2));color:#04141a;border-color:transparent;font-weight:750}
.btn.gold{background:linear-gradient(135deg,#f59e0b,var(--accent3));color:#2a1c02;border-color:transparent;font-weight:750}
.btn.green{background:linear-gradient(135deg,#059669,var(--ok));color:#05281d;border-color:transparent;font-weight:750}
.btn.red{background:linear-gradient(135deg,#e11d48,var(--bad));color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.big{padding:14px 24px;font-size:1rem;border-radius:16px}
.btn.xbig{padding:20px 30px;font-size:1.18rem;border-radius:20px}
.btn.sm{padding:6px 11px;font-size:.78rem;border-radius:10px}
.btn.block{width:100%;justify-content:center}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}

/* ============ FORM ============ */
input[type=text],input[type=number],input[type=search],input[type=date],input[type=time],textarea,select{
  width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--card-brd);background:var(--input);
  color:var(--tx);font-family:inherit;font-size:.9rem;outline:none;transition:var(--tr)}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.18)}
textarea{resize:vertical;min-height:110px;line-height:1.6}
label.fld{display:block;margin-bottom:11px}
label.fld>span{display:block;font-size:.78rem;color:var(--tx2);margin-bottom:5px;font-weight:600;letter-spacing:.3px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--card-brd);background:var(--card);color:var(--tx2);
  font-size:.79rem;cursor:pointer;transition:var(--tr);font-weight:600;user-select:none}
.chip:hover{color:var(--tx);background:var(--card-hi)}
.chip.on{background:linear-gradient(135deg,var(--accent),#4b2ee0);color:#fff;border-color:transparent}
.chip.mini{padding:4px 9px;font-size:.72rem}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.switch input{display:none}
.switch .track{width:44px;height:25px;border-radius:99px;background:var(--input);border:1px solid var(--card-brd);position:relative;transition:var(--tr)}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--tx3);transition:var(--tr)}
.switch input:checked+.track{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.switch input:checked+.track::after{left:21px;background:#fff}

/* ============ ETİKETLER / KARTLAR ============ */
.tag{display:inline-block;padding:3px 9px;border-radius:8px;font-size:.7rem;font-weight:700;background:var(--input);
  border:1px solid var(--card-brd);color:var(--tx2);letter-spacing:.2px}
.tag.ok{color:#0d2a1e;background:var(--ok);border-color:transparent}
.tag.warn{color:#2a1c02;background:var(--warn);border-color:transparent}
.tag.bad{color:#3a0a12;background:var(--bad);border-color:transparent}
.tag.acc{color:#fff;background:linear-gradient(135deg,var(--accent),#4b2ee0);border-color:transparent}
.tag.cy{color:#04141a;background:var(--accent2);border-color:transparent}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.pick{background:linear-gradient(160deg,var(--card-hi),var(--card));border:1px solid var(--card-brd);border-radius:var(--r-lg);
  padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.pick::before{content:"";position:absolute;inset:0 auto auto 0;height:4px;width:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3))}
.pick .title{font-size:1.3rem;font-weight:800;margin:6px 0 2px}
.pick .meta{color:var(--tx2);font-size:.83rem}
.listrow{display:flex;gap:11px;align-items:flex-start;padding:11px;border-radius:14px;background:var(--card);
  border:1px solid var(--card-brd);transition:var(--tr)}
.listrow:hover{background:var(--card-hi);transform:translateX(2px)}
.listrow .ico{font-size:1.5rem;line-height:1}
.listrow .tt{font-weight:700;font-size:.92rem}
.listrow .dd{color:var(--tx2);font-size:.8rem}
.list{border:1px solid var(--card-brd);border-radius:14px;overflow:hidden;background:var(--input)}
.list .lr{padding:10px 12px;border-bottom:1px solid var(--card-brd);display:flex;gap:10px;align-items:flex-start}
.list .lr:last-child{border-bottom:0}
.list .lr:hover{background:var(--card-hi)}
.list .lr .grow{flex:1;min-width:0}
.list .lr .t{font-weight:700;font-size:.88rem}
.list .lr .s{color:var(--tx3);font-size:.74rem;margin-top:1px;overflow-wrap:anywhere}
.list .lr .a{display:flex;gap:6px;flex-shrink:0}
.scroll{max-height:430px;overflow-y:auto;padding-right:4px}
.scroll::-webkit-scrollbar{width:8px}
.scroll::-webkit-scrollbar-thumb{background:var(--card-brd);border-radius:8px}
.bar{height:9px;border-radius:99px;background:var(--input);overflow:hidden;border:1px solid var(--card-brd)}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s ease}
.bar>i.gold{background:linear-gradient(90deg,#f59e0b,var(--accent3))}
.bar>i.green{background:linear-gradient(90deg,#059669,var(--ok))}
.bar>i.bad{background:linear-gradient(90deg,#e11d48,var(--bad))}
.empty{padding:22px;text-align:center;color:var(--tx3);border:1px dashed var(--card-brd);border-radius:16px;font-size:.86rem}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
body.calm *{animation:none !important;transition:none !important}

/* ============ TARLA ============ */
.plots{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.plot{position:relative;border-radius:16px;padding:12px 10px;text-align:center;cursor:pointer;overflow:hidden;
  border:1px solid var(--card-brd);background:linear-gradient(180deg,rgba(120,80,40,.20),rgba(60,40,20,.35));transition:var(--tr)}
html[data-theme="light"] .plot{background:linear-gradient(180deg,#e9d9c2,#cbb596)}
.plot:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.plot.dry{background:linear-gradient(180deg,rgba(150,110,60,.30),rgba(90,60,25,.5))}
html[data-theme="light"] .plot.dry{background:linear-gradient(180deg,#dfc9a6,#bfa27c)}
.plot.ready{box-shadow:0 0 0 2px var(--ok),0 8px 24px rgba(52,211,153,.28);animation:pulse 1.7s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(52,211,153,.35),0 8px 26px rgba(52,211,153,.18)}}
.plot .crop-emo{font-size:2.5rem;line-height:1.1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.4))}
.plot .crop-nm{font-size:.76rem;font-weight:700;margin-top:2px}
.plot .plot-bg{position:absolute;inset:0;opacity:.5;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 2px,transparent 2px 12px)}
.plot .mini-prog{height:6px;border-radius:9px;background:rgba(0,0,0,.35);margin-top:7px;overflow:hidden}
.plot .mini-prog>i{display:block;height:100%;background:linear-gradient(90deg,#34d399,#a3e635)}
.plot .lock{position:absolute;top:7px;right:8px;font-size:.72rem}
.seed-grid{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.seed{display:flex;gap:9px;align-items:center;padding:9px;border-radius:13px;border:1px solid var(--card-brd);
  background:var(--card);cursor:pointer;transition:var(--tr)}
.seed:hover{background:var(--card-hi);transform:translateY(-2px)}
.seed .se{font-size:1.7rem}
.seed .sn{font-weight:700;font-size:.85rem}
.seed .sd{font-size:.71rem;color:var(--tx3)}

/* ============ AĞAÇ ============ */
.tree-stage{position:relative;display:grid;place-items:center;min-height:250px;border-radius:20px;overflow:hidden;
  background:linear-gradient(180deg,rgba(34,211,238,.10),rgba(124,92,255,.06) 40%,rgba(120,80,40,.25));
  border:1px solid var(--card-brd)}
.tree-stage .ground{position:absolute;bottom:0;left:0;right:0;height:56px;background:linear-gradient(180deg,#5b8a3a,#2f5a24)}
html[data-theme="light"] .tree-stage .ground{background:linear-gradient(180deg,#8cbe63,#4e7f37)}
.tree-stage svg{position:relative;z-index:2;transition:transform .6s ease}
.water-drops{position:absolute;inset:0;pointer-events:none;z-index:3}
.drop{position:absolute;top:-14px;font-size:1rem;animation:fall 1.05s ease-in forwards}
@keyframes fall{to{transform:translateY(240px) rotate(35deg);opacity:0}}

/* ============ ÇARK ============ */
.wheelwrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.wheel{width:min(300px,74vw);aspect-ratio:1;border-radius:50%;position:relative;border:8px solid var(--card-brd);
  box-shadow:var(--shadow);transition:transform 3.6s cubic-bezier(.17,.67,.16,1);
  background-image:conic-gradient(var(--accent) 0 45deg,var(--accent2) 45deg 90deg,var(--accent3) 90deg 135deg,
    #f472b6 135deg 180deg,var(--ok) 180deg 225deg,#60a5fa 225deg 270deg,#c084fc 270deg 315deg,#fb923c 315deg 360deg)}
.wheel .hub{position:absolute;inset:0;margin:auto;width:56px;height:56px;border-radius:50%;background:var(--bg2);
  border:3px solid var(--card-brd);display:grid;place-items:center;font-size:1.4rem;z-index:3}
.wheel .labels{position:absolute;inset:0}
.wheel .labels span{position:absolute;left:50%;top:50%;transform-origin:0 0;font-size:.7rem;font-weight:800;color:#101425;
  text-shadow:0 1px 0 rgba(255,255,255,.4);white-space:nowrap}
.wheel-pin{font-size:1.6rem;line-height:1;margin-bottom:-10px}

/* ============ SORU (QUIZ) ============ */
.qbox{background:linear-gradient(160deg,var(--card-hi),var(--card));border:1px solid var(--card-brd);
  border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.qtext{font-size:1.12rem;font-weight:700;margin:10px 0 14px;line-height:1.45}
.opts{display:grid;gap:9px}
.opt{text-align:left;padding:13px 15px;border-radius:14px;border:1px solid var(--card-brd);background:var(--card);
  color:var(--tx);font-size:.94rem;font-weight:600;cursor:pointer;transition:var(--tr);font-family:inherit;display:flex;gap:11px;align-items:center}
.opt:hover:not(:disabled){background:var(--card-hi);transform:translateX(3px);border-color:var(--accent)}
.opt .key{width:26px;height:26px;border-radius:8px;background:var(--input);display:grid;place-items:center;font-size:.78rem;flex-shrink:0;font-weight:800}
.opt.correct{background:linear-gradient(135deg,#059669,var(--ok));color:#04241a;border-color:transparent}
.opt.correct .key{background:rgba(0,0,0,.16)}
.opt.wrong{background:linear-gradient(135deg,#be123c,var(--bad));color:#fff;border-color:transparent}
.opt:disabled{cursor:default}
.feedback{padding:12px 14px;border-radius:14px;font-size:.88rem;margin-top:12px;border:1px solid var(--card-brd);background:var(--input)}
.combo{font-weight:800;color:var(--accent3)}

/* ============ HAFIZA OYUNU ============ */
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:400px;margin:0 auto}
.mcard{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;font-size:1.9rem;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#4b2ee0);border:1px solid var(--card-brd);transition:transform .3s,background .3s;
  user-select:none;color:#fff}
.mcard.open{background:var(--card-hi);color:var(--tx)}
.mcard.done{background:linear-gradient(135deg,#059669,var(--ok));opacity:.6;cursor:default}
.mcard:active{transform:scale(.94)}
.target-area{position:relative;height:300px;border-radius:18px;border:1px solid var(--card-brd);overflow:hidden;

<script>
/* =========================================================================
   NE YAPSAM? · Tek dosyalık dev uygulama
   Bölüm 1 — Çekirdek: durum, depolama, yardımcılar, puan, ses, bildirim
   ========================================================================= */
'use strict';
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = (s='') => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const TL=n=>new Intl.NumberFormat('tr-TR').format(Math.round(n));

/* ---------- Zaman yardımcıları ---------- */
const MS={dk:60000, saat:3600000, gun:86400000};
function dateKey(d=new Date()){ const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
function keyToDate(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function fmtDur(ms,short){ ms=Math.max(0,ms);
  const d=Math.floor(ms/MS.gun), h=Math.floor(ms%MS.gun/MS.saat), m=Math.floor(ms%MS.saat/MS.dk), s=Math.floor(ms%MS.dk/1000);
  if(ms<MS.dk) return s+' sn';
  if(ms<MS.saat) return m+' dk'+(s&&!short?' '+s+' sn':'');
  if(ms<MS.gun) return h+' sa '+(m&&!short?m+' dk':'');
  return d+' gün '+(h&&!short?h+' sa':'');
}
function fmtClock(ms){ const t=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function fmtHM(ms){ const t=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function fmtDateTr(ts){ return new Date(ts).toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'}); }
function fmtDateTimeTr(ts){ return new Date(ts).toLocaleString('tr-TR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
const AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const GUNLER=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];

/* ---------- Varsayılan durum ---------- */
const LS_KEY='neyapsam_v1';
function defaultState(){ return {
  v:1, createdAt:Date.now(),
  user:{ name:'', city:'Aydın', grade:5, skin:1, hair:'#3b2a1d', hairStyle:'kisa', shirt:'#7c5cff' },
  theme:'dark', bigText:false, calm:false, sound:true,
  points:0, level:1,
  owned:['hat_none','glass_none','bg_default','pet_none'],
  equipped:{ hat:'hat_none', glasses:'glass_none', bg:'bg_default', pet:'pet_none', hair:'hair_kisa', outfit:'out_default' },
  seen:{ last:Date.now(), lastMaintain:Date.now(), totalMs:0, visits:1, first:Date.now() },
  streak:{ count:0, best:0, lastDay:null },
  farm:{ plots:new Array(9).fill(null), harvested:0, wateredTotal:0, planted:0 },
  tree:{ stage:0, wateredDays:0, dayStreak:0, lastWaterDay:null, fruits:0, totalWater:0 },
  water:{ on:true, everyMin:20, nextAt:Date.now()+20*60000, drinks:0, lastDrink:null, drops:6, dropsAt:null, total:0 },
  alarm:{ at:null, label:'', on:false },
  study:{ timer:{mode:'study', running:false, startedAt:null, accum:0, targetMin:25, rounds:0},
          goals:{ studyMin:120, gameMin:60 }, sessions:[] },
  quiz:{ correct:0, wrong:0, streakNow:0, bestStreak:0, bySubject:{}, answeredToday:{}, today:dateKey(), wrongs:[], recent:{} },
  stats:{ byDate:{} },
  counters:{ tabsSeen:{}, night:0, early:0, weekend:0, quests:0, perfectDay:0, themeUses:0, marketDone:0, totalTabs:0 },
  log:[], notes:[], watchlist:[], playlists:[], favFoods:[], doneTasks:[], seenBadges:[],
  prefs:{ mediaP:{}, mediaG:{}, mediaM:{}, mealP:{}, placeP:{} },
  api:{ ytKey:'' },
  pinned:['home','sikildim','oyun_yok']
};}

let S;
/* localStorage bazı ortamlarda (gizli mod, kısıtlı iframe) engellidir — güvenli sarmalayıcı */
const Store={
  ok:true,
  get(k){ try{ return localStorage.getItem(k); }catch(e){ Store.ok=false; return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ Store.ok=false; return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ Store.ok=false; } }
};
function load(){
  try{ const raw=Store.get(LS_KEY); if(!raw) return defaultState();
    const d=JSON.parse(raw); return deepMerge(defaultState(), d);
  }catch(e){ console.warn('Kayıt okunamadı',e); return defaultState(); }
}
function deepMerge(base,over){
  if(Array.isArray(base)) return Array.isArray(over)?over:base;
  if(typeof base!=='object'||base===null) return (over===undefined||over===null)?base:over;
  const out={...(base)};
  for(const k in over){ out[k] = (k in base) ? deepMerge(base[k],over[k]) : over[k]; }
  return out;
}
let saveTimer=null, lastSave=0;
function save(now){ clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ try{
      S.seen.totalMs += Date.now()-S.seen.lastMaintain; S.seen.lastMaintain=Date.now();
      Store.set(LS_KEY, JSON.stringify(S)); lastSave=Date.now();
    }catch(e){ console.warn('Kaydedilemedi',e); } }, now?0:250); }
function stat(datek=dateKey()){ if(!S.stats.byDate[datek]) S.stats.byDate[datek]={study:0,game:0,water:0,quiz:0,tasks:0,pts:0,farm:0,notes:0}; return S.stats.byDate[datek]; }

/* ---------- Seviye sistemi ---------- */
const LEVELS=[0,80,200,400,700,1100,1700,2500,3600,5000,6800,9000,12000,16000,21000,28000,36000,46000,58000,75000];
const LEVEL_NAMES=['Sıkılan','Meraklı','Kurcalayan','Kâşif','Düzenli','Planlı','Üretken','Usta','Şampiyon','Efsane','Bilge','Bilge+','Zen','Zirve','Sıkılmaz','Sıkılmaz+','Şef','Kaptan','Kozmik','Efsanevi'];
function levelOf(p){ let l=1; for(let i=0;i<LEVELS.length;i++) if(p>=LEVELS[i]) l=i+1; return Math.min(l,LEVELS.length); }
function levelInfo(p){ const l=levelOf(p), cur=LEVELS[l-1]||0, nxt=LEVELS[l]??null;
  return {lvl:l, name:LEVEL_NAMES[l-1]||'Efsane', cur, next:nxt, pct:nxt?clamp((p-cur)/(nxt-cur)*100,0,100):100}; }

/* ---------- Puan / günlük kayıt ---------- */
function addPts(n,text,emo='✨',silent){
  if(!n) return;
  S.points=Math.max(0,S.points+n); stat().pts=Math.max(0,(stat().pts||0)+n);
  const before=levelOf(S.points-n), after=levelOf(S.points);
  if(text) logAct(emo,text+(n>0?` (+${n} puan)`:` (${n} puan)`));
  if(after>before){ S.level=after; setTimeout(()=>{ toast('⭐','Seviye atladın!',`Artık <b>Lv ${after} · ${LEVEL_NAMES[after-1]}</b> seviyesindesin.`,'good'); confetti(); sfx.level(); },450); }
  if(!silent) flashPts(n);
  App.renderHeader(); save();
}
function logAct(emo,text){ S.log.unshift({t:Date.now(),e:emo,x:text}); if(S.log.length>240) S.log.length=240; }
function flashPts(n){ const b=$('#hdrPts'); if(!b) return; b.style.transition='transform .2s'; b.style.transform='scale(1.16)';
  b.classList.add('glow'); setTimeout(()=>{b.style.transform='';b.classList.remove('glow')},220); }

/* ---------- Toast / bildirim ---------- */
function toast(icon,title,msg,kind='',ms=4200,actions){
  const box=$('#toasts'); if(!box) return;
  const t=document.createElement('div'); t.className='toast '+(kind||'')+(actions?' has-actions':'');
  t.innerHTML=`<div class="th"><span>${icon}</span><span>${esc(title)}</span></div>`+
    (msg?`<div class="muted tiny">${msg}</div>`:'')+
    (actions?`<div class="btnrow" style="margin-top:9px">${actions}</div>`:'');
  box.appendChild(t);
  // Yığın sınırı: en fazla 3 bildirim dursun, fazlası hemen kapanır (ekranı kaplamasın)
  try{ const all=[...box.children]; if(all.length>3) all.slice(0,all.length-3).forEach(x=>x.remove()); }catch(e){}
  if(ms>0){ const kill=()=>{ t.style.opacity=0; t.style.transform='translateX(40px)'; setTimeout(()=>t.remove(),300); };
    const timer=setTimeout(kill,ms); t.addEventListener('mouseenter',()=>clearTimeout(timer));
    t.addEventListener('click',e=>{ if(e.target.closest('button')) return; kill(); }); }
  return t;
}
function notify(icon,title,msg,kind=''){
  toast(icon,title,msg,kind,9000);
  try{
    if('Notification' in window && Notification.permission==='granted' && document.hidden){
      new Notification(title,{body:msg.replace(/<[^>]+>/g,''), tag:'neyapsam-'+title});
    }
  }catch(e){}
}
function confirmBox(text){ return new Promise(res=>{
  showModal(`<h2>🤔 Emin misin?</h2><p class="muted">${esc(text)}</p>
    <div class="btnrow end"><button class="btn ghost" onclick="App._cf(false)">Vazgeç</button>
    <button class="btn red" onclick="App._cf(true)">Evet, devam</button></div>`,{lock:true});
  App._cf = v=>{ closeModal(); res(v); };
});}
function showModal(html,opt={}){ const m=$('#modal'); m.innerHTML=html; $('#overlay').classList.add('open'); if(!opt.lock) m.dataset.unlock='1'; }
function closeModal(){ $('#overlay').classList.remove('open'); $('#modal').innerHTML=''; }

/* ---------- Ses (WebAudio, dosyasız) ---------- */
const sfx=(()=>{
  let ctx=null;
  const ac=()=>{ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ctx; };
  function tone(f,dur=.14,type='sine',vol=.16,delay=0){
    if(!S||!S.sound) return; const c=ac(); if(!c) return;
    if(c.state==='suspended') c.resume();
    const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.value=f;
    o.connect(g); g.connect(c.destination); const t0=c.currentTime+delay;
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+.012);
    g.gain.exponentialRampToValueAtTime(.0008,t0+dur); o.start(t0); o.stop(t0+dur+.03);
  }
  return {
    click:()=>tone(560,.07,'triangle',.07),
    ok:()=>{tone(660,.1,'sine',.14);tone(880,.14,'sine',.12,.08)},
    bad:()=>{tone(220,.2,'sawtooth',.10);tone(160,.24,'sawtooth',.08,.09)},
    coin:()=>{tone(1180,.07,'square',.07);tone(1560,.1,'square',.06,.06)},
    level:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.2,'sine',.13,i*.09))},
    water:()=>{tone(300,.1,'sine',.09);tone(420,.13,'sine',.07,.07)},
    harvest:()=>{[700,900,1200].forEach((f,i)=>tone(f,.14,'triangle',.11,i*.06))},
    alarm:()=>{for(let i=0;i<6;i++) tone(i%2?880:660,.16,'square',.13,i*.2)},
    focus:()=>{tone(392,.5,'sine',.08);tone(523,.6,'sine',.07,.35)}
  };
})();

/* ---------- Konfeti ---------- */
function confetti(n=90){
  const cv=$('#confetti'); if(!cv) return;
  let ctx=null; try{ ctx=cv.getContext('2d'); }catch(e){}
  if(!ctx) return; // canvas desteklenmiyorsa sessizce geç
  cv.classList.remove('hidden'); cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#7c5cff','#22d3ee','#fbbf24','#34d399','#fb7185','#60a5fa'];
  const parts=Array.from({length:n},()=>({x:Math.random()*cv.width,y:-20-Math.random()*120,
    vx:(Math.random()-.5)*3, vy:2+Math.random()*4, s:5+Math.random()*7, c:pick(cols), r:Math.random()*6, vr:(Math.random()-.5)*.4}));
  let f=0;
  (function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.05; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62); ctx.restore(); });
    if(++f<170) requestAnimationFrame(loop); else { ctx.clearRect(0,0,cv.width,cv.height); cv.classList.add('hidden'); }
  })();
}

/* ---------- Dosya indirme yardımcısı (Blob yoksa data URI) ---------- */
function download(filename, content, mime){
  mime=mime||'text/plain;charset=utf-8';
  try{
    const blob=new Blob([content],{type:mime});
    const url=(window.URL&&URL.createObjectURL)?URL.createObjectURL(blob):('data:'+mime+','+encodeURIComponent(content));
    const a=document.createElement('a'); a.href=url; a.download=filename; a.rel='noopener';
    document.body.appendChild(a); a.click(); a.remove();
    if(window.URL&&URL.revokeObjectURL) setTimeout(()=>URL.revokeObjectURL(url),4000);
    return true;
  }catch(e){
    try{ const a=document.createElement('a'); a.href='data:'+mime+','+encodeURIComponent(content); a.download=filename; a.click(); return true; }catch(e2){ return false; }
  }
}

/* ---------- Kaydetme / kopyalama: engellenen ortamlarda da çalışır ---------- */
const Save={
  pending:null,
  text(filename,content,mime,label){
    Save.pending={filename:filename,content:String(content),mime:mime||'text/plain;charset=utf-8',label:label||filename};
    if(inFrame()){ Save.modal(); return; }                     // önizleme: indirme engelli olabilir
    const ok=download(filename,Save.pending.content,Save.pending.mime);
    if(ok) toast('📥','İndiriliyor…',filename+' kaydediliyor.','good',3000);
    else { toast('⚠️','İndirme engellendi','İçeriği pencerede açtım, oradan kopyalayabilirsin.','warn',3400); Save.modal(); }
  },
  show(content,label,filename){
    Save.pending={filename:filename||'metin.txt',content:String(content),mime:'text/plain;charset=utf-8',label:label||'Metin'};
    Save.modal();
  },
  modal(){
    const p=Save.pending||{}; const c=String(p.content||'');
    const isImg=/^data:image\//.test(c.slice(0,20));
    showModal(`<h2>💾 ${esc(p.label||p.filename||'Kaydet')}</h2>
      <p class="tiny muted">${isImg?'Görseli indirmek için aşağıdaki resme uzun bas (mobil) veya sağ tıkla. Dilersen “İndirmeyi dene” butonunu kullan.':'Önizleme penceresi dosya indirmeyi engelleyebilir. Metni aşağıdan kopyalayabilir ya da indirmeyi deneyebilirsin.'}</p>
      ${isImg?`<img src="${c}" alt="çıktı" style="max-width:100%;border-radius:14px;border:1px solid var(--card-brd)">`
             :`<label class="fld"><span>${esc(p.filename||'metin.txt')}</span><textarea id="svOut" rows="11" readonly>${esc(c)}</textarea></label>`}
      <div class="btnrow end"><button class="btn ghost" onclick="closeModal()">Kapat</button>
        ${isImg?'':'<button class="btn" onclick="Save.copy()">📋 Metni kopyala</button>'}
        <button class="btn primary" onclick="Save.try()">⬇️ İndirmeyi dene</button></div>`);
    setTimeout(()=>{ const el=$('#svOut'); if(el){ el.focus(); try{ el.setSelectionRange(0,0); }catch(e){} } },70); },
  copy(){
    const el=$('#svOut');
    if(!el){ toast('ℹ️','Kopyalanacak metin yok','','warn',2400); return; }
    try{ el.focus(); el.select(); }catch(e){}
    let done=false;
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(el.value).then(()=>toast('📋','Kopyalandı','Panoya aktarıldı.','good',2400),()=>{}); done=true; } }catch(e){}
    if(!done){ try{ done=!!(document.execCommand&&document.execCommand('copy')); }catch(e){} }
    if(done) toast('📋','Kopyalandı','Panoya aktarıldı.','good',2400);
    else toast('⌨️','Elle kopyala','Metin seçili: Ctrl+C (veya uzun bas → Kopyala)','warn',3600); },
  try(){
    const p=Save.pending; if(!p){ toast('ℹ️','Kayıt yok','','warn',2400); return; }
    const ok=download(p.filename,p.content,p.mime);
    toast(ok?'📥':'⚠️',ok?'İndirme istendi':'İndirme engellendi',
      ok?p.filename:'Uygulamayı tarayıcıda açtığında dosya doğrudan kaydedilir.','',3400); }
};
function copyText(text,label,filename){
  let done=false;
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(
      ()=>toast('📋','Kopyalandı',(label||'Metin')+' panoya aktarıldı.','good',2600),
      ()=>Save.show(text,label,filename)); done=true; } }catch(e){}
  if(done) return;
  try{ if(document.execCommand&&document.execCommand('copy')){} }catch(e){}
  Save.show(text,label,filename);   // kopyalama engelliyse metni göster
}

    if([0,6].includes(new Date().getDay())) S.counters.weekend=(S.counters.weekend||0)+1;
    S.counters.tabsSeen=S.counters.tabsSeen||{};

    if(!Store.ok) setTimeout(()=>App.storageWarning(),700);

    setTimeout(()=>{

    },600);

    save();
    addEventListener('beforeunload',()=>save(true));
  addEventListener('resize',()=>{ clearTimeout(window.__hh); window.__hh=setTimeout(()=>{ try{ App.syncHdrH(); }catch(e){} },150); });
    addEventListener('pagehide',()=>save(true));

    document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ App.dayRollover(); App.renderHeader(); if(S.water.on&&Date.now()>=S.water.nextAt) Water.remind(); } });

  /* ---------- Sekme sistemi ---------- */
  bindTabs(){
    $('#navbar').innerHTML=TABS.map(t=>`<button class="tab" data-tab="${t.id}" onclick="App.go('${t.id}')" title="${esc(t.n)}">

      `<button class="tab p20-devtab" onclick="Dev.acikla()" title="Geliştiriciler ve okul markası"><span class="tb-emo">👨‍💻</span><span>Geliştiriciler</span></button>`;
    App.renderQuickbar();

  renderQuickbar(){
    const qb=$('#quickbar'); const pinned=(S.pinned||[]).filter(id=>TABS.some(t=>t.id===id));
    if(!pinned.length){ qb.innerHTML=''; return; }
    qb.innerHTML='<span>📌 Hızlı:</span>'+pinned.map(id=>{
      const t=TABS.find(x=>x.id===id); if(!t) return '';
      return `<span class="qt" onclick="App.go('${id}')">${t.e} ${esc(t.n)}<span class="x" title="Kaldır" onclick="event.stopPropagation();App.unpin('${id}')">✕</span></span>`;
    }).join('');
  },
  pin(id){ S.pinned=S.pinned||[]; if(!S.pinned.includes(id)){ S.pinned.push(id); logAct('📌',TABS.find(t=>t.id===id).n+' hızlı erişime eklendi'); save(); App.renderQuickbar(); toast('📌','Hızlı erişime eklendi',esc(TABS.find(t=>t.id===id).n),'good',2500);} else App.unpin(id); },
  unpin(id){ S.pinned=(S.pinned||[]).filter(x=>x!==id); save(); App.renderQuickbar(); },
  go(id,force){
    if(!TABS.some(t=>t.id===id)) id='home';
    try{ if(VIEWS[App.tab]&&VIEWS[App.tab].leave) VIEWS[App.tab].leave(); }catch(e){}
    if(window.MiniGames&&MiniGames.stop) MiniGames.stop();
    App.tab=id;
    $$('#navbar .tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));

      if(nav&&act&&nav.scrollWidth>nav.clientWidth+4){ const nr=nav.getBoundingClientRect(), ar=act.getBoundingClientRect();

    main.innerHTML = v ? v() : '<div class="empty">Bu bölüm yükleniyor…</div>';

  renderHeader(){

      save();

  },
  /* ---------- Saat döngüsü ---------- */
  tick(){
    const now=Date.now(); const dt=now-App.lastTick; App.lastTick=now;
    App.renderHeader();
    App.dayRollover();
    // Çalışma / mola sayacı
    const t=S.study.timer;
    if(t.running){
      const add=dt;
      t.accum+=add;
      stat().study = (stat().study||0) + (t.mode==='study'? add/MS.dk : 0);
      stat().game  = (stat().game||0)  + (t.mode==='game'  ? add/MS.dk : 0);
      if(t.mode==='game'&&t.accum>t.targetMin*MS.dk && !t.warned){ t.warned=true;
        notify('🎮','Mola süresi doldu',`${t.targetMin} dakikalık mola bitti. Şimdi 25 dakika odaklanma zamanı!`,'warn');

/* JS-string + HTML-attribute güvenli kaçış: inline onclick içinde metin geçirirken kullanılır */
function jsa(x){ return String(x==null?'':x).replace(/\\/g,'\\\\').replace(/'/g,"\\'")
  .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escj(x){ return jsa(x); }
function secHead(e,t,sub){ return `<div class="sec-head"><span class="sh-ico">${e}</span><div><h2>${esc(t)}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div></div>`; }
function seedRandom(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return Math.abs(h)/4294967296; }; }
function dailyPick(arr,extra=''){ const r=seedRandom(dateKey()+extra); return arr[Math.floor(r()*arr.length)]; }
function pct(a,b){ return b?clamp(a/b*100,0,100):0; }
function barHtml(p,cls=''){ return `<div class="bar"><i class="${cls}" style="width:${p.toFixed(1)}%"></i></div>`; }
function tagList(arr,cls){ return (arr||[]).map(x=>`<span class="tag ${cls||''}">${esc(x)}</span>`).join(''); }
function star(r){ return `<span title="${r}/5">${'★'.repeat(Math.round(r))}${'☆'.repeat(5-Math.round(r))}</span>`; }

function treeSVG(stage,fruits,size){
  size=size||200; const cx=size/2, base=size-20, st=clamp(stage,0,6);
  let s=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
  s+=`<ellipse cx="${cx}" cy="${base+4}" rx="${size*0.35}" ry="10" fill="rgba(20,55,20,.55)"/>`;
  if(st===0){ s+=`<ellipse cx="${cx}" cy="${base-4}" rx="11" ry="8" fill="#8b5e3c"/><ellipse cx="${cx+3}" cy="${base-6}" rx="4" ry="3" fill="#5d3d24"/></svg>`; return s; }
  const th=6+st*13;
  s+=`<path d="M${cx-4} ${base} q3 ${-th*0.55} 0 ${-th} l9 0 q-3 ${th*0.55} 0 ${th} z" fill="#7a5230"/>`;
  if(st>=3) s+=`<path d="M${cx-1} ${base-th*0.55} q-18 -4 -24 -16" stroke="#7a5230" stroke-width="4" fill="none"/>
                <path d="M${cx+7} ${base-th*0.5} q16 -5 22 -15" stroke="#7a5230" stroke-width="4" fill="none"/>`;
  if(st===1){ s+=`<ellipse cx="${cx-11}" cy="${base-16}" rx="11" ry="6" transform="rotate(-25 ${cx-11} ${base-16})" fill="#4caf50"/>
                 <ellipse cx="${cx+11}" cy="${base-19}" rx="11" ry="6" transform="rotate(25 ${cx+11} ${base-19})" fill="#66bb6a"/>`; }
  else{
    const cy=base-th-6, r=8+st*5.4, blobs=[[0,0,1],[ -0.75,-0.1,.78],[0.75,-0.05,.8],[0,-0.62,.72],[-0.4,-0.55,.55],[0.42,-0.6,.6]];
    blobs.slice(0,Math.min(blobs.length,2+st)).forEach((b,i)=>{
      s+=`<circle cx="${cx+b[0]*r*1.05}" cy="${cy+b[1]*r*1.05-6}" r="${r*b[2]}" fill="${i%2?'#3f9a44':'#4fb356'}" opacity="0.95"/>`; });
    if(st>=6) s+=`<circle cx="${cx}" cy="${cy}" r="${r*0.35}" fill="#63c96a" opacity=".6"/>`;
    if(fruits&&st>=4){
      const pos=[[-0.5,0.1],[0.45,-0.15],[0,-0.4],[-0.2,0.35],[0.25,0.3]];
      pos.slice(0,Math.min(fruits,5)).forEach(p=>{ s+=`<circle cx="${cx+p[0]*r}" cy="${cy+p[1]*r-6}" r="6" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>`; });
    }
  }
  s+='</svg>'; return s;
}

VIEWS.home=function(){
  const now=new Date(), h=now.getHours();
  const selam = h<6?'İyi geceler':h<11?'Günaydın':h<14?'İyi günler':h<18?'İyi öğleden sonralar':h<22?'İyi akşamlar':'İyi geceler';
  const li=levelInfo(S.points);
  const d=stat();
  const ready=Object.values(S.farm.plots).filter(p=>p&&Date.now()>=p.readyAt).length;
  const ekili=Object.values(S.farm.plots).filter(Boolean).length;
  const dry=Object.values(S.farm.plots).filter(p=>p&&!p.wateredToday).length + (S.tree.lastWaterDay!==dateKey()?1:0);
  const g=dailyPick(GAMES,'g'), f=dailyPick(MOVIES,'f'), m=dailyPick(MUSIC,'m'), y=dailyPick(FOODS,'y'), c=dailyPick(CITIES,'c');
  const questRows=DAILY_QUESTS.map(q=>{ const st=App.questState(q);
    return `<div class="lr"><div class="grow"><div class="t">${q.e} ${esc(q.n)}</div>
      <div style="margin-top:5px">${barHtml(pct(st.cur,st.goal),st.ok?'green':'')}</div>
      <div class="s">${st.cur}/${st.goal}${st.ok?' ✅ tamam':''}</div></div>
      <div class="a">${st.ok?(st.claimed?'<span class="tag ok">alındı</span>':`<button class="btn sm gold" onclick="App.claimQuest('${q.id}')">+${q.r} al 🪙</button>`):`<span class="tag">${q.r} puan</span>`}</div></div>`; }).join('');
  const recent=(S.log||[]).slice(0,7).map(l=>`<div class="lr"><span>${l.e}</span><div class="grow"><div class="t" style="font-weight:600;font-size:.84rem">${esc(l.x)}</div><div class="s">${fmtDateTimeTr(l.t)}${(()=>{const a=Math.floor((Date.now()-l.t)/MS.dk);return a<1?' · az önce':` · ${fmtDur(Date.now()-l.t,true)} önce`;})()}</div></div></div>`).join('')||'<div class="lr"><div class="grow"><div class="s">Henüz hareket yok. Hadi bir şeyler yap! 🚀</div></div></div>';
  const achNext=ACH.filter(a=>!S.seenBadges.includes(a.id)).map(a=>({a,p:clamp(a.p(S)/a.g*100,0,100)})).sort((x,y)=>y.p-x.p).slice(0,4)
    .map(x=>`<div class="lr"><span>${x.a.e}</span><div class="grow"><div class="t">${esc(x.a.n)}</div><div style="margin:4px 0">${barHtml(x.p,'gold')}</div><div class="s">${esc(x.a.d)} — %${x.p.toFixed(0)}</div></div></div>`).join('')||'<div class="lr"><div class="grow"><div class="s">Tüm başarımlar açıldı! 🏆</div></div></div>';
  const timer=S.study.timer;
  const timerTxt = timer.running ? (timer.mode==='study'?'⏱️ Odaklanıyorsun':'🎮 Moladasın') : '⏸️ Sayaç duruyor';
  const timerLeft = timer.targetMin*MS.dk - timer.accum;
  return `
  ${secHead('🏠',`${selam}${S.user.name?', '+esc(S.user.name):''}!`,`${GUNLER[now.getDay()]}, ${fmtDateTr(now)} · ${esc(S.user.city)}`) }
  <div class="grid g2">
    <div class="card glow">
      <div class="row between"><h3>⭐ Seviye ${li.lvl} · ${li.name}</h3><span class="tag acc">🪙 ${TL(S.points)} puan</span></div>
      ${barHtml(li.pct)}
      <div class="tiny muted mt">${li.next?`Sonraki seviyeye <b>${TL(li.next-S.points)}</b> puan kaldı`:'Maksimum seviyedesin, efsane!'}</div>
      <div class="statcards mt">
        <div class="statcard"><div class="v">🔥 ${S.streak.count||0}</div><div class="l">gün serisi</div></div>
        <div class="statcard"><div class="v">⏱️ ${Math.round(d.study||0)}</div><div class="l">bugün odak (dk)</div></div>
        <div class="statcard"><div class="v">🧠 ${(d.quiz||0)}</div><div class="l">bugün soru</div></div>
        <div class="statcard"><div class="v">💧 ${S.water.drinks||0}</div><div class="l">bugün su</div></div>
      </div>
      <div class="btnrow mt">
        <button class="btn primary" onclick="App.go('sikildim')">🎡 Sıkıldım, bir şey öner</button>
        <button class="btn" onclick="App.pin('sikildim')" title="Hızlı erişime ekle/çıkar">📌</button>
      </div>
    </div>
    <div class="card">
      <div class="row between"><h3>🌅 Günün önerileri</h3><span class="tiny muted">her gün otomatik yenilenir</span></div>
      <div class="list">
        <div class="lr"><span>🎮</span><div class="grow"><div class="t">${esc(g.n)}</div><div class="s">${esc(g.g)} · ${g.p==='steam'?'Steam':g.p==='epic'?'Epic':'Diğer'} · ${star(g.r)}</div></div><div class="a"><button class="btn sm" onclick="Media.openGame('${jsa(g.n)}')">Aç</button></div></div>
        <div class="lr"><span>🎬</span><div class="grow"><div class="t">${esc(f.n)}</div><div class="s">${esc(f.g.join(', '))} · ${f.y} · ${star(f.r)}</div></div><div class="a"><button class="btn sm" onclick="Media.openWatch('${jsa(f.n)}')">Aç</button></div></div>
        <div class="lr"><span>🎵</span><div class="grow"><div class="t">${esc(m.a)} — ${esc(m.s)}</div><div class="s">${esc(m.g)} · ${m.y}</div></div><div class="a"><button class="btn sm" onclick="Media.openMusic('${jsa(m.a)}','${jsa(m.s)}')">Çal</button></div></div>
        <div class="lr"><span>🍽️</span><div class="grow"><div class="t">${esc(y.n)}</div><div class="s">${y.dk} dk · ${esc(y.t)}${y.v?' · vejetaryen':''}</div></div><div class="a"><button class="btn sm" onclick="App.go('yesem')">Tarif</button></div></div>
        <div class="lr"><span>🧭</span><div class="grow"><div class="t">${esc(c.n)}</div><div class="s">${esc(c.s.join(' · '))}</div></div><div class="a"><button class="btn sm" onclick="App.go('gezi')">Gez</button></div></div>
      </div>
    </div>
  </div>

  <div class="grid g2 mt2">
    <div class="card">
      <div class="row between"><h3>📋 Bugünün görevleri</h3><span class="tag">${DAILY_QUESTS.filter(q=>App.questState(q).claimed).length}/${DAILY_QUESTS.length} alındı</span></div>
      <div class="list">${questRows}</div>
      <div class="hint mt">İpucu: hepsini tamamlarsan <b>+100 bonus puan</b> ve “Kusursuz Gün” başarımı.</div>
    </div>
    <div class="card">
      <h3>🌳 Bahçem ve zamanım</h3>
      <div class="row" style="gap:16px;align-items:center">
        <div class="tree-stage" style="min-width:190px;min-height:210px;flex:0 0 auto;padding:6px">
          <div class="ground"></div>${treeSVG(S.tree.stage,S.tree.fruits,180)}</div>
        <div style="flex:1;min-width:170px">
          <div class="kv"><span>🌱 Ekili alan</span><span>${ekili}/9</span></div>
          <div class="kv"><span>🧺 Hasat bekleyen</span><span>${ready}</span></div>
          <div class="kv"><span>💧 Su bekleyen</span><span>${dry}</span></div>
          <div class="kv"><span>🌳 Ağaç seviyesi</span><span>${S.tree.stage}/6</span></div>
          <div class="kv"><span>🔥 Sulama serisi</span><span>${S.tree.dayStreak||0} gün</span></div>
          <div class="btnrow mt">
            <button class="btn green sm" onclick="App.go('bahce')">Bahçeye git</button>
            <button class="btn cyan sm" onclick="Water.drink()">💧 Su iç (+2)</button>
          </div>
        </div>
      </div>
      <div class="row between mt">
        <div><b>${timerTxt}</b><div class="tiny muted">${timer.running?`Kalan: ${fmtClock(timerLeft)} · Hedef: ${timer.targetMin} dk`:`Hedef: ${timer.targetMin} dk · ${timer.mode==='study'?'odak':'mola'} modu`}</div></div>
        <div class="btnrow">
          <button class="btn sm ${timer.running?'red':'primary'}" onclick="Study.toggle()">${timer.running?'Durdur':'Başlat'}</button>
          <button class="btn sm" onclick="App.go('ogren')">Ayrıntı</button>
        </div>
      </div>
    </div>
  </div>

  <div class="grid g2 mt2">
    <div class="card"><h3>🕒 Son hareketler</h3><div class="list scroll" style="max-height:300px">${recent}</div>
      <div class="hint mt">Bilgisayarın kapalıyken uygulama çalışmaz ama <b>zaman işler</b>: ekinler büyür, seri ve görevler gerçek güne göre hesaplanır.</div></div>
    <div class="card"><h3>🏅 Yaklaşan başarımlar</h3><div class="list">${achNext}</div>
      <div class="btnrow mt"><button class="btn sm" onclick="App.go('avatar')">🏅 Tüm başarımlar ve mağaza</button></div></div>
  </div>

  <div class="card pad-lg mt2">
    <h3>⚡ Hızlı seçim</h3>
    <div class="btnrow">
      <button class="btn big" onclick="Media.pick('games')">🎮 Ne oynasam?</button>
      <button class="btn big" onclick="Media.pick('film')">🎬 Ne izlesem?</button>
      <button class="btn big" onclick="Media.pick('music')">🎵 Ne dinlesem?</button>
      <button class="btn big" onclick="Media.pick('food')">🍽️ Ne yesem?</button>
      <button class="btn big" onclick="Media.pick('city')">🧭 Nereyi gezsem?</button>
      <button class="btn big cyan" onclick="App.go('sikildim')">🎡 Çarkı çevir</button>
    </div>
  </div>`;
};
</script>
<script>
/* =========================================================================
   Bölüm 8 — MEDYA SEÇİCİ: oyun, film, müzik, yemek, gezi + entegrasyon linkleri
   ========================================================================= */
const REGIONS={
 'Marmara':['Balıkesir','Bilecik','Bursa','Çanakkale','Edirne','İstanbul','Kırklareli','Kocaeli','Sakarya','Tekirdağ','Yalova'],
 'Ege':['Afyonkarahisar','Aydın','Denizli','İzmir','Kütahya','Manisa','Muğla','Uşak'],
 'Akdeniz':['Adana','Antalya','Burdur','Hatay','Isparta','Kahramanmaraş','Mersin','Osmaniye'],
 'İç Anadolu':['Aksaray','Ankara','Çankırı','Eskişehir','Karaman','Kayseri','Kırıkkale','Kırşehir','Konya','Nevşehir','Niğde','Sivas','Yozgat'],
 'Karadeniz':['Amasya','Artvin','Bartın','Bayburt','Bolu','Çorum','Düzce','Giresun','Gümüşhane','Karabük','Kastamonu','Ordu','Rize','Samsun','Sinop','Tokat','Trabzon','Zonguldak'],
 'Doğu Anadolu':['Ağrı','Ardahan','Bingöl','Bitlis','Elazığ','Erzincan','Erzurum','Hakkari','Iğdır','Kars','Malatya','Muş','Tunceli','Van'],
 'Güneydoğu Anadolu':['Adıyaman','Batman','Diyarbakır','Gaziantep','Kilis','Mardin','Siirt','Şanlıurfa','Şırnak']
};
function regionOf(city){ for(const r in REGIONS) if(REGIONS[r].includes(city)) return r; return 'Türkiye'; }
function uniq(a){ return Array.from(new Set(a)); }
function inFrame(){ try{ return window.self!==window.top; }catch(e){ return true; } }
function ext(href,label,cls){ const h=String(href).replace(/"/g,'&quot;');
  return `<a class="btn sm ${cls||''}" href="${h}" target="_blank" rel="noopener"${inFrame()?' onclick="return App.previewLink(event,this)"':''}>${label}</a>`; }
function q(s){ return encodeURIComponent(s); }

const Media={
  last:{},
  filters:{
    games:{p:'all',g:'all',s:'all',m:'all',free:false,q:''},
    film:{t:'all',g:'all',l:'all',m:'all',q:''},
    music:{g:'all',m:'all',q:''},
    food:{k:'all',maxDk:0,veg:false,z:0,q:''},
    city:{mode:'random',region:'all',city:''}
  },
  /* ---------- aday listeleri ---------- */
  candidates(kind){
    const f=Media.filters;
    if(kind==='games'){ return GAMES.filter(x=>
      (f.games.p==='all'||x.p===f.games.p)&&
      (f.games.g==='all'||x.g===f.games.g)&&
      (f.games.s==='all'||x.s===f.games.s)&&
      (f.games.m==='all'||(x.m||[]).includes(f.games.m))&&
      (!f.games.free||x.f)&&
      (!f.games.q||x.n.toLowerCase().includes(f.games.q.toLowerCase()))); }
    if(kind==='film'){ return MOVIES.filter(x=>
      (f.film.t==='all'||x.t===f.film.t)&&
      (f.film.g==='all'||x.g.includes(f.film.g))&&
      (f.film.l==='all'||x.l===f.film.l)&&
      (f.film.m==='all'||(x.m||[]).includes(f.film.m))&&
      (!f.film.q||x.n.toLowerCase().includes(f.film.q.toLowerCase()))); }
    if(kind==='music'){ return MUSIC.filter(x=>
      (f.music.g==='all'||x.g===f.music.g)&&
      (f.music.m==='all'||(x.m||[]).includes(f.music.m))&&
      (!f.music.q||(x.a+' '+x.s).toLowerCase().includes(f.music.q.toLowerCase()))); }
    if(kind==='food'){ return FOODS.filter(x=>
      (f.food.k==='all'||x.k.includes(f.food.k))&&
      (!f.food.maxDk||x.dk<=f.food.maxDk)&&
      (!f.food.veg||x.v)&&
      (!f.food.z||x.z<=f.food.z)&&
      (!f.food.q||(x.n+' '+(x.mal||[]).join(' ')).toLowerCase().includes(f.food.q.toLowerCase()))); }
    if(kind==='city'){
      let arr=CITIES;
      if(f.city.mode==='own'){ const own=CITIES.find(c=>c.n.toLowerCase()===String(S.user.city||'').toLowerCase()); arr=own?[own]:[]; }
      if(f.city.mode==='region'&&f.city.region!=='all') arr=CITIES.filter(c=>regionOf(c.n)===f.city.region);
      if(f.city.mode==='city'&&f.city.city) arr=CITIES.filter(c=>c.n===f.city.city);
      return arr; }
    return [];
  },
  /* ---------- akıllı rastgele seçim (son seçileni tekrar etmez) ---------- */
  rand(kind){
    const list=Media.candidates(kind);
    if(!list.length) return null;
    const seen=S.prefs.mediaP[kind]||[];
    const fresh=list.filter(x=>!seen.includes(x.n||(x.a+' - '+x.s)));
    const pool=fresh.length?fresh:list;
    const it=pool[Math.floor(Math.random()*pool.length)];
    const key=it.n||(it.a+' - '+it.s);
    S.prefs.mediaP[kind]=[key].concat(seen).slice(0,25);
    if(kind==='games')   S.prefs.mediaG[it.g]=(S.prefs.mediaG[it.g]||0)+1;
    if(kind==='film')    it.g.forEach(g=>S.prefs.mediaG['f_'+g]=(S.prefs.mediaG['f_'+g]||0)+1);
    if(kind==='music')   S.prefs.mediaM[it.g]=(S.prefs.mediaM[it.g]||0)+1;
    save();
    return it;
  },
  pick(kind){
    const it=Media.rand(kind);
    if(!it){ toast('🔍','Uygun sonuç yok','Filtreleri biraz gevşetmeyi dene.','warn'); return; }
    Media.last[kind]=it;
    stat().secim=(stat().secim||0)+1;
    const today=stat().secim;
    if(today<=20) addPts(2,{games:'Oyun önerisi aldın',film:'İzleme önerisi aldın',music:'Müzik önerisi aldın',food:'Yemek önerisi aldın',city:'Gezi önerisi aldın'}[kind],{games:'🎮',film:'🎬',music:'🎵',food:'🍽️',city:'🧭'}[kind]);
    sfx.ok();
    showModal(Media.modalHtml(kind,it));
  },
  openGame(name){ const g=GAMES.find(x=>x.n===name)||{n:name,p:'steam',g:'',d:''}; showModal(Media.modalHtml('games',g)); },
  openWatch(name){ const f=MOVIES.find(x=>x.n===name)||{n:name,t:'film',g:[],d:''}; showModal(Media.modalHtml('film',f)); },
  openMusic(a,s){ const m=MUSIC.find(x=>x.a===a&&x.s===s)||{a:a,s:s,g:'',m:[]}; showModal(Media.modalHtml('music',m)); },
  openFood(name){ const y=FOODS.find(x=>x.n===name)||{n:name,k:[],mal:[],d:''}; showModal(Media.modalHtml('food',y)); },
  /* ---------- entegrasyon linkleri ---------- */
  gameLinks(g){ const nm=q(g.n);
    return [
      g.p!=='epic'?ext(`https://store.steampowered.com/search/?term=${nm}`,'Steam\'de aç','primary'):'',
      g.p!=='steam'?ext(`https://store.epicgames.com/tr/browse?q=${nm}`,'Epic\'te aç','primary'):'',
      ext(`https://www.youtube.com/results?search_query=${nm}+${q('inceleme oynanış')}`,'YouTube inceleme','red'),
      ext(`https://www.google.com/search?q=${nm}+${q('sistem gereksinimleri fiyat')}`,'Fiyat & gereksinim','ghost'),
      (g.f?`<span class="tag ok">Ücretsiz oyun</span>`:''),
      (g.p==='steam'?`<span class="tag cy">Steam</span>`:g.p==='epic'?`<span class="tag cy">Epic</span>`:`<span class="tag">Diğer platform</span>`)
    ].filter(Boolean).join(' ');
  },
  filmLinks(f){ const nm=q(f.n);
    return [
      ext(`https://www.justwatch.com/tr/ara?q=${nm}`,'Nerede izlenir? (JustWatch)','primary'),
      ext(`https://www.youtube.com/results?search_query=${nm}+${q('fragman')}`,'Fragman','red'),
      ext(`https://www.imdb.com/find/?q=${nm}`,'IMDb','ghost'),
      f.t==='anime'?ext(`https://myanimelist.net/search/all?q=${nm}`,'MyAnimeList','ghost'):''
    ].filter(Boolean).join(' ');
  },
  musicLinks(m){ const nm=q(m.a+' '+m.s);
    return [
      ext(`https://open.spotify.com/search/${q(m.a+' '+m.s)}`,'Spotify\'da aç','green'),
      ext(`https://www.youtube.com/results?search_query=${nm}`,'YouTube\'da çal','red'),
      ext(`https://music.youtube.com/search?q=${nm}`,'YouTube Music','red'),
      ext(`https://open.spotify.com/search/${q(m.s)}`,'Şarkıyı çalan listeler','ghost')
    ].join(' ');
  },
  foodLinks(y){ const nm=q(y.n);
    return [
      ext(`https://www.youtube.com/results?search_query=${nm}+${q('tarifi')}`,'Video tarif','red'),
      ext(`https://www.google.com/search?q=${nm}+${q('tarif kolay')}`,'Yazılı tarif','ghost'),
      ext(`https://www.nefisyemektarifleri.com/arama/?s=${nm}`,'Nefis Yemek Tarifleri','ghost')
    ].join(' ');
  },
  cityLinks(c){ const nm=q(c.n);
    return [
      ext(`https://www.google.com/maps/dir/?api=1&destination=${nm}`,'🚗 Yol tarifi (Google Maps)','primary'),
      ext(`https://www.google.com/search?q=${nm}+${q('gezilecek yerler hava durumu')}`,'Hava & gezi bilgisi','ghost'),
      ext(`https://www.google.com/maps/search/${q('gezilecek yerler ')}${nm}`,'Haritada gezilecek yerler','ghost'),
      ext(`https://youtube.com/results?search_query=${nm}+${q('gezi rehberi')}`,'Vlog & rehber','red')
    ].join(' ');
  },
  /* ---------- modal gövdesi ---------- */
  modalHtml(kind,it){
    if(kind==='games') return `
      <h2>🎮 Oyun önerisi</h2>
      <div class="pick"><div class="title">${esc(it.n)}</div>
        <div class="meta">${esc(it.g)} · ${it.y} · ${it.s} oyun · ${star(it.r)} ${ratingText(it.r)}</div>
        <div class="tags">${tagList(it.m,'cy')} ${it.f?'<span class="tag ok">Ücretsiz</span>':''}</div>
        <p>${esc(it.d)}</p></div>
      <div class="btnrow mt">${Media.gameLinks(it)}</div>
      <div class="btnrow mt">
        <button class="btn primary sm" onclick="Media.pick('games')">🎲 Başka öner</button>
        <button class="btn sm" onclick="Media.favGame('${jsa(it.n)}')">❤️ Favorilere ekle</button>
        <button class="btn sm" onclick="Media.watchAdd('${jsa(it.n)}','games')">📋 Listeme ekle</button>
      </div>`;
    if(kind==='film') return `
      <h2>🎬 ${it.t==='dizi'?'Dizi':it.t==='anime'?'Anime':it.t==='belgesel'?'Belgesel':'Film'} önerisi</h2>
      <div class="pick"><div class="title">${esc(it.n)}</div>
        <div class="meta">${esc(it.g.join(' · '))} · ${it.y} · ${it.l} · ${star(it.r)} · önerilen: ${esc(it.pl||'-')}</div>
        <div class="tags">${tagList(it.m,'cy')}<span class="tag">${esc(it.t)}</span></div>
        <p>${esc(it.d)}</p></div>
      <div class="row"><span class="tiny muted">Platform bilgisi değişebilir; JustWatch ile teyit et.</span></div>
      <div class="btnrow mt">${Media.filmLinks(it)}</div>
      <div class="btnrow mt">
        <button class="btn primary sm" onclick="Media.pick('film')">🎲 Başka öner</button>
        <button class="btn green sm" onclick="Media.watchAdd('${jsa(it.n)}','movies')">➕ İzleme listeme ekle</button>
        <button class="btn sm" onclick="Media.watched('${jsa(it.n)}')">✅ İzledim (+8 puan)</button>
      </div>`;
    if(kind==='music') return `
      <h2>🎵 Müzik önerisi</h2>
      <div class="pick"><div class="title">${esc(it.a)} — ${esc(it.s)}</div>
        <div class="meta">${esc(it.g)} · ${it.y}${it.m&&it.m.length?' · ruh hali: '+esc(it.m.join(', ')):''}</div>
        ${Media.ytEmbed(it.a+' '+it.s)}</div>
      <div class="btnrow mt">${Media.musicLinks(it)}</div>
      <div class="btnrow mt">
        <button class="btn primary sm" onclick="Media.pick('music')">🎲 Başka öner</button>
        <button class="btn green sm" onclick="Media.addToPlaylist('${jsa(it.a)}','${jsa(it.s)}')">➕ Çalma listeme ekle</button>
        <button class="btn sm" onclick="Media.queueAdd('${jsa(it.a)}','${jsa(it.s)}')">⏭️ Sıraya ekle</button>
      </div>`;
    if(kind==='food'){ const m=Media.pantryMatch(it); return `
      <h2>🍽️ Ne yesem?</h2>
      <div class="pick"><div class="title">${esc(it.n)}</div>
        <div class="meta">${it.dk} dk · zorluk ${'●'.repeat(it.z)}${'○'.repeat(3-it.z)} · ${esc(it.t)}${it.v?' · vejetaryen':''} · ${esc(it.k.join(', '))}</div>

        <button class="btn primary sm" onclick="Media.pick('food')">🎲 Başka öner</button>

        ${m.missing.length?`<button class="btn sm cyan" onclick="Media.marketAdd('${jsa(m.missing.join('|'))}')">🛒 Eksikleri listeme ekle</button>`:''}
        <button class="btn green sm" onclick="Media.cooked('${jsa(it.n)}')">🍳 Yaptım (+10 puan)</button>
      </div>`; }
    if(kind==='city') return `
      <h2>🧭 Nereyi gezsem?</h2>
      <div class="pick"><div class="title">${esc(it.n)} <span class="tag">${esc(regionOf(it.n))}</span></div>
        <div class="meta">${esc(it.d)}</div>
        <div class="list mt">${it.s.map(sp=>`<div class="lr"><span>📍</span><div class="grow"><div class="t">${esc(sp)}</div>
          <div class="a">${ext('https://www.google.com/maps/search/'+q(sp+' '+it.n),'Harita','ghost')}</div></div></div>`).join('')}</div></div>
      <div class="btnrow mt">${Media.cityLinks(it)}</div>
      <div class="btnrow mt">
        <button class="btn primary sm" onclick="Media.pick('city')">🎲 Başka öner</button>
        <button class="btn green sm" onclick="Media.visited('${jsa(it.n)}')">✅ Buraya gittim (+15 puan)</button>
        <button class="btn sm" onclick="Media.planAdd('${jsa(it.n)}')">📋 Gezi planıma ekle</button>
      </div>`;
    return '';
  },
  ytEmbed(term){
    return `<div class="mt"><span class="tiny muted">🎧 Tarayıcıda dene (YouTube arama gömülü oynatıcı — bazı tarayıcılarda/önizlemelerde engellenebilir, çalışmazsa yukarıdaki linkleri kullan):</span>
      <div class="ytbox" style="margin-top:8px"><button class="btn sm" onclick="Media.loadEmbed('${jsa(term)}')">▶️ Gömülü oynatıcıyı yükle</button></div></div>`;
  },
  loadEmbed(term){ const box=$('#modal .ytbox'); if(!box) return;
    box.innerHTML=`<iframe width="100%" height="215" style="border-radius:14px;border:1px solid var(--card-brd)" src="https://www.youtube.com/embed?listType=search&list=${q(term)}" title="YouTube" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin" loading="lazy"></iframe>`;
  },
  pantryMatch(y){ const p=(S.pantry||PANTRY_DEFAULT).map(x=>x.toLowerCase());
    const missing=uniq((y.mal||[]).filter(m=>!p.includes(m.toLowerCase())));
    return {ok:missing.length===0, missing}; },
  /* ---------- aksiyonlar ---------- */
  favGame(n){ const g=GAMES.find(x=>x.n===n); S.favGames=S.favGames||[];
    if(S.favGames.includes(n)){ S.favGames=S.favGames.filter(x=>x!==n); toast('💔','Favorilerden çıkarıldı',esc(n),'',2500); }
    else { S.favGames.push(n); addPts(3,'Oyun favorilere eklendi: '+n,'❤️'); toast('❤️','Favorilere eklendi',esc(n),'good',3000); }
    save(); App.checkAch(); if(App.tab==='oyun_yok') App.repaintCurrent(); closeModal(); },
  watchAdd(n,type){ S.watchlist.push({n,t:type,at:Date.now()}); addPts(3,'Listeye eklendi: '+n,'📋');
    toast('📋','Listenize eklendi',esc(n)+' — İzleme listesi Notlar sekmesinde saklanır.','good',3200); save(); App.checkAch(); closeModal(); },
  watched(n){ const item=S.watchlist.find(x=>x.n===n); if(item){ item.done=true; item.doneAt=Date.now(); }
    else S.watchlist.push({n,t:'movies',at:Date.now(),done:true,doneAt:Date.now()});
    stat().tasks=(stat().tasks||0)+1; addPts(8,'İzledim olarak işaretlendi: '+n,'✅'); save(); App.checkAch(); closeModal(); },
  addToPlaylist(a,s){ S.playlists=S.playlists||[];
    if(!S.playlists.length) S.playlists.push({id:uid(),n:'Favorilerim',songs:[]});
    S.playlists[0].songs.push({a,s,at:Date.now()});
    addPts(3,`Çalma listesine eklendi: ${a} — ${s}`,'➕'); toast('🎧','Çalma listesine eklendi',esc(a+' — '+s),'good',3000);
    save(); App.checkAch(); },
  queueAdd(a,s){ S.queue=S.queue||[]; S.queue.push({a,s}); toast('⏭️','Sıraya eklendi',`${esc(a)} — ${esc(s)} (${S.queue.length} şarkı sırada)`,'good',3000); save(); },
  foodFav(n){ if(S.favFoods.includes(n)){ S.favFoods=S.favFoods.filter(x=>x!==n); } else { S.favFoods.push(n); addPts(3,'Yemek favorilere eklendi: '+n,'❤️'); }
    save(); App.checkAch(); closeModal(); toast('🍽️','Favoriler güncellendi',esc(n),'good',2600); },
  cooked(n){ stat().tasks=(stat().tasks||0)+1; addPts(10,'Yemek yapıldı: '+n,'🍳'); confetti(40); save(); App.checkAch(); closeModal(); },
  marketAdd(joined){ const items=joined.split('|'); S.market=S.market||[];
    items.forEach(i=>{ if(i&&!S.market.some(m=>m.n===i)) S.market.push({n:i,done:false}); });
    toast('🛒','Market listesi güncellendi',`${items.length} malzeme eklendi. Liste: Ne Yesem sekmesi.`,'good',3400); save(); },
  visited(city){ S.visitedCities=S.visitedCities||[]; if(!S.visitedCities.includes(city)){ S.visitedCities.push(city);
    S.prefs.placeP[city]=(S.prefs.placeP[city]||0)+1; addPts(15,'Gezi tamamlandı: '+city,'🧭'); confetti(70); } 
    save(); App.checkAch(); closeModal(); toast('🧭','Ne güzel!',esc(city)+' gezdiklerin arasına eklendi.','good',3200); },
  planAdd(city){ S.plans=S.plans||[]; if(!S.plans.some(p=>p.city===city)) S.plans.push({city,at:Date.now(),items:[]});
    toast('🗺️','Gezi planına eklendi',esc(city)+' — Özetler sekmesinden planlarını görebilirsin.','good',3200); save(); App.checkAch(); },
  /* gezi önerisi aldığı şehirleri de say */
  noteCityPref(city){ S.prefs.placeP[city]=(S.prefs.placeP[city]||0)+1; save(); }
};

<script>
/* =========================================================================
   Bölüm 9 — SIKILDIM: görev çarkı + mini oyunlar
   ========================================================================= */
Media.setF=function(kind,key,val){ Media.filters[kind][key]=val; S.filters=Media.filters;
  if(key==='q'){ Media.searchMusic(val,'searchMusic'); return; }
  save(); sfx.click(); App.repaintCurrent(); };
Media.searchMusic=function(v,id){ Media.filters.music.q=v; S.filters=Media.filters; save();
  clearTimeout(Media._t); Media._t=setTimeout(()=>{ try{ App.repaintCurrent(); }catch(e){}
    try{ const el=document.getElementById(id||'searchMusic'); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } }catch(e){} },260); };
Media.resetF=function(kind){ Media.filters[kind]=JSON.parse(JSON.stringify(Media.filtersDefault[kind])); S.filters=Media.filters; save(); App.repaintCurrent();
  let n=0; try{ n=Media.candidates(kind).length; }catch(e){}
  toast('↺','Filtreler sıfırlandı', n?n+' içerik yeniden listelendi.':'Tüm filtreler başlangıç değerine döndü.','good',2600); };
Media.filtersDefault=JSON.parse(JSON.stringify(Media.filters));
if(S&&S.filters) Media.filters=S.filters;

const WHEEL_CATS=[
 {k:'hareket',n:'Hareket',e:'🏃'},{k:'ev',n:'Ev İşi',e:'🏠'},{k:'zihin',n:'Zihin',e:'🧠'},{k:'sosyal',n:'Sosyal',e:'👥'},
 {k:'yaratıcı',n:'Yaratıcı',e:'🎨'},{k:'sağlık',n:'Sağlık',e:'💚'},{k:'plan',n:'Plan',e:'🎯'},{k:'eğlence',n:'Eğlence',e:'🎮'}
];
const Wheel={
  spinning:false, lastCat:null, lastTask:null,
  labelsHtml(){ return WHEEL_CATS.map((c,i)=>{
    const a=i*45+22.5;
    return `<span style="transform:rotate(${a}deg) translate(-50%,-118px) rotate(${-a}deg)">${c.e} ${c.n}</span>`; }).join(''); },
  spin(){
    if(Wheel.spinning) return; Wheel.spinning=true;
    const idx=Math.floor(Math.random()*8), seg=45;
    const target=360*5 + (360 - (idx*seg + seg/2));
    const w=$('#wheel');
    if(w){ w.style.transition='transform 3.6s cubic-bezier(.17,.67,.16,1)'; w.style.transform=`rotate(${target}deg)`; }
    sfx.click();
    setTimeout(()=>{
      Wheel.spinning=false; Wheel.lastCat=WHEEL_CATS[idx].k;
      const tasks=BORED_TASKS.filter(t=>t.c===WHEEL_CATS[idx].k);
      Wheel.lastTask=tasks.length?tasks[Math.floor(Math.random()*tasks.length)]:null;
      App.repaintCurrent();
      setTimeout(()=>{ const el=$('#wheelResult'); if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); },250);
    },3700);
  },
  again(){ const cat=Wheel.lastCat||'eğlence', tasks=BORED_TASKS.filter(t=>t.c===cat);
    Wheel.lastTask=tasks.length?tasks[Math.floor(Math.random()*tasks.length)]:null; App.repaintCurrent(); },
  done(){ if(!Wheel.lastTask) return;
    const n=(stat().gorev||0)+1; stat().gorev=n;
    const pts = n<=10?15:5;
    addPts(pts,'Sıkılma görevi yapıldı: '+Wheel.lastTask.t,'🎉'); sfx.coin(); confetti(45);
    logAct('✅','Görev tamam: '+Wheel.lastTask.t);
    save(); App.checkAch(); toast('🎉','Harika!',`Görevi tamamladın: <b>${esc(Wheel.lastTask.t)}</b> (+${pts} puan)`,'good',5200);
    Wheel.lastTask=null; App.repaintCurrent(); }
};
const MiniGames={
  timer:null, state:{},
  stop(){ if(MiniGames.timer){ clearInterval(MiniGames.timer); MiniGames.timer=null; } },
  best(k,v){ S.mini=S.mini||{}; if(v!==undefined){ if(!S.mini[k]||(k==='reaction'? v<S.mini[k] : v>S.mini[k])) S.mini[k]=v; save(); } return S.mini[k]; },
  start(kind){
    MiniGames.stop(); MiniGames.state={kind};
    if(kind==='mem') return MiniGames.mem.start();
    if(kind==='target') return MiniGames.target.start();
    if(kind==='reaction') return MiniGames.reaction.start();
    if(kind==='math') return MiniGames.math.start();
  },
  /* ---- Hafıza ---- */
  mem:{
    emojis:['🍎','🚀','🐱','🌵','⚽','🎸','🍕','🦊'],
    start(){ const cards=MiniGames.mem.emojis.concat(MiniGames.mem.emojis)
        .map((e,i)=>({e,i:Math.random()})).sort((a,b)=>a.i-b.i).map((c,i)=>({id:i,emoji:c.e,open:false,done:false}));
      MiniGames.state.cards=cards; MiniGames.state.flips=0; MiniGames.state.open=[]; MiniGames.state.t0=Date.now(); MiniGames.state.locked=false;
      MiniGames.mem.paint(); },
    paint(){ const st=MiniGames.state;
      showModal(`<h2>🧠 Hafıza Oyunu</h2>
        <p class="muted tiny">Çiftleri eşleştir. Süre ve hamle sayısı hesaplanır, en iyi süren kaydedilir. <b>Rekorun: ${MiniGames.best('mem')?Math.round(MiniGames.best('mem')/1000)+' sn':'—'}</b></p>
        <div class="mem-grid" id="memGrid">${st.cards.map(c=>`
          <div class="mcard ${c.open||c.done?'open':''} ${c.done?'done':''}" onclick="MiniGames.mem.flip(${c.id})">${(c.open||c.done)?c.emoji:'❔'}</div>`).join('')}</div>
        <div class="row between mt"><span class="tiny muted">Hamle: <b>${st.flips}</b> · Süre: <b id="memTime">0</b> sn</span>
        <button class="btn sm" onclick="MiniGames.mem.start()">🔄 Yeniden</button></div>`,{lock:false});
      if(!MiniGames.timer) MiniGames.timer=setInterval(()=>{ const el=document.getElementById('memTime'); if(el&&MiniGames.state.kind==='mem') el.textContent=Math.round((Date.now()-MiniGames.state.t0)/1000); },1000);
    },
    flip(id){ const st=MiniGames.state; if(st.locked) return; const c=st.cards.find(x=>x.id===id);
      if(!c||c.open||c.done) return;
      c.open=true; sfx.click(); st.open.push(c); MiniGames.mem.paint();
      if(st.open.length===2){ st.flips++; st.locked=true;
        const [a,b]=st.open;
        if(a.emoji===b.emoji){ setTimeout(()=>{ a.done=b.done=true; st.open=[]; st.locked=false;
            if(st.cards.every(x=>x.done)){ const ms=Date.now()-st.t0; MiniGames.best('mem',ms);
              addPts(25,'Hafıza oyunu bitirildi ('+st.flips+' hamle)','🧠'); sfx.level(); confetti(70);
              toast('🏆','Tebrikler!',`${st.flips} hamlede, ${Math.round(ms/1000)} saniyede bitirdin. (+25 puan)`,'good',6000); }
            MiniGames.mem.paint(); },420); }
        else setTimeout(()=>{ a.open=b.open=false; st.open=[]; st.locked=false; MiniGames.mem.paint(); },720);
      }
    }
  },
  /* ---- Hedef vurma ---- */
  target:{ time:30, score:0, left:30,
    start(){ MiniGames.state.score=0; MiniGames.state.left=MiniGames.target.time;
      showModal(`<h2>🎯 Hedef Vurma</h2>
        <p class="muted tiny">30 saniyede mümkün olduğunca çok hedefe tıkla. Rekorun: <b>${MiniGames.best('target')||0}</b></p>
        <div class="row between"><span class="tag">Skor: <b id="tgScore">0</b></span><span class="tag warn">Kalan: <b id="tgLeft">30</b> sn</span></div>
        <div class="target-area mt" id="tgArea" onclick="MiniGames.target.miss(event)"></div>
        <div class="btnrow mt end"><button class="btn sm" onclick="MiniGames.target.start()">🔄 Yeniden</button></div>`);
      MiniGames.target.spawn();
      MiniGames.timer=setInterval(()=>{ MiniGames.state.left--; const el=document.getElementById('tgLeft'); if(el) el.textContent=MiniGames.state.left;
        if(MiniGames.state.left<=0){ clearInterval(MiniGames.timer); MiniGames.timer=null;
          const sc=MiniGames.state.score; MiniGames.best('target',sc);
          addPts(Math.min(60,5+sc*2),'Hedef vurma oyunu: '+sc+' isabet','🎯'); sfx.level(); confetti(50);
          toast('🎯','Süre bitti!',`Skorun: <b>${sc}</b>. ${sc>=20?'Vay be, refleksler sağlam!':'Tekrar dene, gittikçe hızlanırsın.'}`,'good',6000);
          MiniGames.target.spawn(); }
      },1000);
    },
    spawn(){ const area=document.getElementById('tgArea'); if(!area) return;
      if(area.querySelector('.target')) return;
      const t=document.createElement('div'); t.className='target'; t.textContent='🎯';
      const w=area.clientWidth-60, h=area.clientHeight-60;
      t.style.left=Math.max(0,Math.random()*w)+'px'; t.style.top=Math.max(0,Math.random()*h)+'px';
      t.onclick=ev=>{ ev.stopPropagation(); MiniGames.state.score++; const s=document.getElementById('tgScore'); if(s) s.textContent=MiniGames.state.score;
        sfx.click(); t.remove(); MiniGames.target.spawn(); };
      area.appendChild(t);
      setTimeout(()=>{ if(t.parentNode) t.remove(); if(MiniGames.state.kind==='target'&&MiniGames.timer) MiniGames.target.spawn(); }, 1400);
    },
    miss(){ /* boşa tıklama: hafif ceza yok, sadece geri bildirim */ }
  },
  /* ---- Tepki testi ---- */
  reaction:{ round:0, times:[],
    start(){ MiniGames.state.round=0; MiniGames.state.times=[]; MiniGames.state.waiting=false;
      showModal(`<h2>⚡ Tepki Testi</h2>
        <p class="muted tiny">Kutu <b>yeşile döner dönmez</b> tıkla. 5 tur oynanır, ortalama süren hesaplanır. Rekorun: <b>${MiniGames.best('reaction')?MiniGames.best('reaction')+' ms':'—'}</b></p>
        <div class="target-area mt" id="rcArea" style="display:grid;place-items:center;cursor:pointer" onclick="MiniGames.reaction.hit()">
          <div id="rcText" style="font-size:1.1rem;font-weight:800;text-align:center;padding:20px">Başlamak için tıkla 👆</div></div>
        <div class="row between mt"><span class="tiny muted">Tur: <b id="rcRound">0</b>/5</span><span class="tiny muted" id="rcInfo"></span></div>`);
    },
    hit(){ const st=MiniGames.state, area=document.getElementById('rcArea'), txt=document.getElementById('rcText');
      if(!area) return;
      if(st.waiting){ // erken tıklama
        st.waiting=false; clearTimeout(MiniGames.timer); area.style.background=''; txt.textContent='Erken tıkladın! 😅 Yeniden bekliyoruz…';
        sfx.bad(); setTimeout(()=>MiniGames.reaction.next(),900); return; }
      if(st.ready){ const ms=Date.now()-st.goAt; st.times.push(ms); st.ready=false; st.round++;
        txt.innerHTML=`${ms} ms ⚡`; sfx.ok();
        document.getElementById('rcRound').textContent=st.round;
        if(st.round>=5){ const avg=Math.round(st.times.reduce((a,b)=>a+b,0)/st.times.length); const bestMs=Math.min(...st.times);
          MiniGames.best('reaction',bestMs);
          addPts(20,'Tepki testi oynandı (ortalama '+avg+' ms)','⚡'); sfx.level();
          txt.innerHTML=`Ortalama: <b>${avg} ms</b><br><span class="tiny muted">En iyi: ${bestMs} ms — tekrar oynamak için tıkla</span>`;
          st.round=0; st.times=[]; st.idle=true; return; }
        setTimeout(()=>MiniGames.reaction.next(),700);
      } else { MiniGames.reaction.next(); }
    },
    next(){ const st=MiniGames.state, area=document.getElementById('rcArea'), txt=document.getElementById('rcText');
      if(!area) return; st.idle=false;
      txt.textContent='Bekle…'; area.style.background=''; st.waiting=true; st.ready=false;
      const delay=900+Math.random()*2200;
      clearTimeout(MiniGames.timer);
      MiniGames.timer=setTimeout(()=>{ st.waiting=false; st.ready=true; st.goAt=Date.now();
        area.style.background='linear-gradient(135deg,#059669,#34d399)'; txt.innerHTML='TIKLA! 👆'; },delay);
    }
  },
  /* ---- Matematik hız ---- */
  math:{ time:60,
    start(){ MiniGames.state.score=0; MiniGames.state.left=MiniGames.math.time; MiniGames.state.q=MiniGames.math.gen();
      showModal(`<h2>➗ Matematik Hız</h2>
        <p class="muted tiny">60 saniyede doğru cevap sayısını artır. Rekorun: <b>${MiniGames.best('math')||0}</b> doğru</p>
        <div class="row between"><span class="tag ok">Doğru: <b id="mtScore">0</b></span><span class="tag warn">Kalan: <b id="mtLeft">60</b> sn</span></div>
        <div class="qbox mt center"><div class="qtext" id="mtQ" style="font-size:1.5rem">${MiniGames.state.q.text}</div>
          <div class="opts" id="mtOpts" style="grid-template-columns:repeat(2,1fr)">${MiniGames.math.opts()}</div></div>`);
      MiniGames.timer=setInterval(()=>{ MiniGames.state.left--; const el=document.getElementById('mtLeft'); if(el) el.textContent=MiniGames.state.left;
        if(MiniGames.state.left<=0){ clearInterval(MiniGames.timer); MiniGames.timer=null;
          const sc=MiniGames.state.score; MiniGames.best('math',sc);
          addPts(Math.min(70,sc*3),'Matematik hız oyunu: '+sc+' doğru','➗'); sfx.level(); confetti(50);
          toast('➗','Süre bitti!',`${sc} doğru cevap. ${sc>=15?'Matematik makinesisin!':'Bir sonrakinde daha hızlı olacaksın.'}`,'good',6000); }
      },1000);
    },
    gen(){ const a=rnd(2,20), b=rnd(2,20), ops=Math.random()<.5?'+':'-';
      let x=ops==='+'?a+b:a-b; if(x<0){ x=a+b; }
      const text=`${a} ${ops} ${b} = ?`;
      const opts=[x]; while(opts.length<4){ const d=x+rnd(-9,9); if(d!==x&&!opts.includes(d)&&d>=0) opts.push(d); }
      return {text,x,opts:opts.map(v=>({v,i:Math.random()})).sort((p,q)=>p.i-q.i).map(o=>o.v)}; },
    opts(){ return MiniGames.state.q.opts.map(v=>`<button class="opt" onclick="MiniGames.math.answer(${v})" style="justify-content:center">${v}</button>`).join(''); },
    answer(v){ const q=MiniGames.state.q, correct=v===q.x;
      if(correct){ MiniGames.state.score++; sfx.ok(); } else sfx.bad();
      const sc=document.getElementById('mtScore'); if(sc) sc.textContent=MiniGames.state.score;
      MiniGames.state.q=MiniGames.math.gen();
      const qe=document.getElementById('mtQ'); if(qe) qe.textContent=MiniGames.state.q.text;
      const op=document.getElementById('mtOpts'); if(op) op.innerHTML=MiniGames.math.opts(); }
  }
};
VIEWS.sikildim=function(){
  const cat=Wheel.lastCat?WHEEL_CATS.find(c=>c.k===Wheel.lastCat):null;
  const res=Wheel.lastTask&&cat?`
    <div class="qbox mt" id="wheelResult">
      <div class="row between"><span class="tag acc">${cat.e} ${esc(cat.n)}</span><span class="tiny muted">Çark sonucu</span></div>
      <div class="qtext">${esc(Wheel.lastTask.t)}</div>
      <div class="btnrow">
        <button class="btn green" onclick="Wheel.done()">✅ Yaptım (+15 puan)</button>
        <button class="btn" onclick="Wheel.again()">🔁 Aynı kategoriden başka görev</button>
        <button class="btn ghost" onclick="Wheel.spin()">🎡 Tekrar çevir</button>

const Pantry={
  add(){ const el=$('#pantryInput'); if(!el){ toast('🍳','Buzdolabı formu açık değil','Ne Yesem sekmesini açıp tekrar dene.','warn',2600); return; } const v=el.value.trim().toLowerCase(); if(!v){ toast('🥕','Bir malzeme yaz','Kutuya malzeme adını yazıp “Ekle”ye bas.','warn',2600); el.focus(); return; }
