<script>
/* =========================================================================
   Bölüm 11 — TEST & OYUN (soru sistemi) + ÖĞRENCİ ARAÇLARI (sayaç)
   ========================================================================= */
function groupOf(g){ return g<=4?'ilk':g<=8?'orta':'lise'; }
function groupName(k){ return k==='ilk'?'İlkokul (1-4)':k==='orta'?'Ortaokul (5-8)':k==='lise'?'Lise (9-12)':'Herkes'; }
const Quiz={
  s:{q:null,answered:false,sel:null,mode:'normal'},
  pool(){ const g=groupOf(S.user.grade||5); return QUIZ.filter(q=>q.k==='her'||q.k===g); },
  subjects(){ return uniq(Quiz.pool().map(q=>q.d)); },
  wrongList(){ S.quiz.wrongs=S.quiz.wrongs||[]; return S.quiz.wrongs; },
  pick(mode){
    Quiz.s.mode=mode||Quiz.s.mode; Quiz.s.answered=false; Quiz.s.sel=null;
    let pool=Quiz.pool();
    if(Quiz.s.subj&&Quiz.s.subj!=='all') pool=pool.filter(q=>q.d===Quiz.s.subj);
    if(Quiz.s.z) pool=pool.filter(q=>q.z<=Quiz.s.z);
    if(Quiz.s.mode==='wrong'){ const w=Quiz.wrongList(); pool=pool.filter(q=>w.includes(q.q)); if(!pool.length){ toast('🎉','Hiç yanlışın kalmadı!','Yanlış listesi boş. Normal moda dönüyorum.','good'); Quiz.s.mode='normal'; pool=Quiz.pool(); } }
    if(!pool.length){ toast('🔍','Soru bulunamadı','Filtreleri değiştirip tekrar dene.','warn'); Quiz.s.q=null; App.repaintCurrent(); return; }
    const recent=S.quiz.recent=Object.assign({},S.quiz.recent);
    const fresh=pool.filter(q=>!recent[q.q]);
    const list=fresh.length?fresh:pool;
    Quiz.s.q=list[Math.floor(Math.random()*list.length)];
    recent[Quiz.s.q.q]=1;
    if(Object.keys(recent).length>60) S.quiz.recent=recent; // sınır
    save(); App.repaintCurrent();   // soru seçildi → ekranı yenile (yoksa buton ölü görünüyordu)
  },
  answer(i){
    const q=Quiz.s.q; if(!q||Quiz.s.answered) return;
    Quiz.s.sel=i; Quiz.s.answered=true;
    const ok=i===q.c;
    S.quiz.answeredToday[q.q]=1;
    S.quiz.bySubject=S.quiz.bySubject||{};
    const bs=S.quiz.bySubject[q.d]=S.quiz.bySubject[q.d]||{c:0,w:0};
    stat().quiz=(stat().quiz||0)+1;
    if(ok){
      bs.c++; S.quiz.correct++; S.quiz.streakNow=(S.quiz.streakNow||0)+1;
      S.quiz.bestStreak=Math.max(S.quiz.bestStreak||0,S.quiz.streakNow);
      const bonus=Math.min(10,Math.max(0,(S.quiz.streakNow-1)*2));
      addPts(10+bonus,`Doğru cevap (${q.d})`,'✅'); sfx.ok();
      if(bonus>0) toast('🔥','Seri bonusu!',`${S.quiz.streakNow} doğru üst üste — +${bonus} ekstra puan.`,'good',4000);
      if(S.quiz.streakNow%10===0){ confetti(90); toast('🏆','Harika seri!',`${S.quiz.streakNow} doğru üst üste!`,'good',6000); }
      S.quiz.wrongs=Quiz.wrongList().filter(x=>x!==q.q);
    } else {
      bs.w++; S.quiz.wrong++; S.quiz.streakNow=0;
      if(!Quiz.wrongList().includes(q.q)) S.quiz.wrongs.push(q.q);
      sfx.bad();
      addPts(0,''); logAct('❌',`Yanlış cevap: ${q.d} — ${q.q.slice(0,40)}…`);
    }
    save(); App.checkAch(); App.repaintCurrent();
  },
  reset(){ S.quiz.correct=0; S.quiz.wrong=0; S.quiz.streakNow=0; S.quiz.bestStreak=0; S.quiz.bySubject={}; S.quiz.wrongs=[]; S.quiz.recent={}; save(); App.repaintCurrent(); toast('↺','Test istatistikleri sıfırlandı','', '',2500); },
  targetPerDay(){ return 20; }
};
VIEWS.test=function(){
  const g=groupOf(S.user.grade||5);
  const d=stat(); const answeredToday=Object.keys(S.quiz.answeredToday||{}).length;
  const total=S.quiz.correct+S.quiz.wrong;
  const rate=total?Math.round(S.quiz.correct/total*100):0;
  const q=Quiz.s.q;
  return `
  ${secHead('🧠','Test & Oyun',`Sınıfına (${S.user.grade}. sınıf · ${esc(groupName(g))}) uygun sorular. Doğru cevap <b>+10 puan</b>, üst üste doğrularda <b>bonus</b>! Bugün çözdüğün: <b>${answeredToday}</b>/${Quiz.targetPerDay()}`)}
  <div class="grid g2">
    <div class="card">
      <div class="row between"><h3>⚙️ Test ayarları</h3><span class="tag">${fmtN(Quiz.pool().length)} soru havuzda</span></div>
      <label class="fld"><span>Sınıfın</span>
        <select onchange="S.user.grade=+this.value;save();Quiz.s.q=null;App.repaintCurrent()">
          ${Array.from({length:12},(_,i)=>i+1).map(n=>`<option value="${n}" ${ (S.user.grade||5)===n?'selected':''}>${n}. sınıf (${groupName(groupOf(n))})</option>`).join('')}
        </select></label>
      <label class="fld"><span>Ders</span>${chipRow([['all','Hepsi']].concat(Quiz.subjects().map(s=>[s,s])),Quiz.s.subj||'all',"Quiz.setSubj('VAL')",'mini')}</label>
      <label class="fld"><span>Zorluk (en fazla)</span>${chipRow([[0,'Hepsi'],[1,'⭐'],[2,'⭐⭐'],[3,'⭐⭐⭐'],[4,'⭐⭐⭐⭐']],Quiz.s.z||0,'Quiz.setZ(VAL)','mini')}</label>
      <div class="btnrow">
        <button class="btn primary" onclick="Quiz.pick('normal')">${q?'🎲 Başka soru':'▶️ Teste başla'}</button>
        <button class="btn gold" onclick="Quiz.pick('wrong')">❌ Yanlışlarımı tekrar et (${Quiz.wrongList().length})</button>
      </div>
    </div>
    <div class="card">
      <h3>📈 Karnem</h3>
      <div class="statcards">
        <div class="statcard"><div class="v">✅ ${S.quiz.correct}</div><div class="l">toplam doğru</div></div>
        <div class="statcard"><div class="v">❌ ${S.quiz.wrong}</div><div class="l">toplam yanlış</div></div>
        <div class="statcard"><div class="v">%${rate}</div><div class="l">başarı oranı</div></div>
        <div class="statcard"><div class="v">🔥 ${S.quiz.bestStreak||0}</div><div class="l">en uzun seri</div></div>
      </div>
      <div class="mt">${barHtml(pct(answeredToday,Quiz.targetPerDay()),'green')}</div>
      <div class="tiny muted mt">Bugünün hedefi: ${Quiz.targetPerDay()} soru · şu an ${answeredToday}</div>
      ${Object.keys(S.quiz.bySubject||{}).length?`<div class="list mt scroll" style="max-height:190px">
        ${Object.keys(S.quiz.bySubject).map(k=>{ const b=S.quiz.bySubject[k];
          return `<div class="lr"><div class="grow"><div class="t">${esc(k)}</div><div style="margin-top:4px">${barHtml(pct(b.c,b.c+b.w),'green')}</div>
            <div class="s">${b.c} doğru / ${b.w} yanlış · %${pct(b.c,b.c+b.w).toFixed(0)}</div></div></div>`; }).join('')}
      </div>`:''}
      <div class="btnrow mt"><button class="btn sm ghost" onclick="Quiz.reset()">İstatistikleri sıfırla</button>
        <button class="btn sm" onclick="Quiz.share()">📋 Sonucu kopyala</button></div>
    </div>
  </div>
  ${q?`<div class="qbox mt2">
    <div class="row between"><span class="tag acc">${esc(q.d)}</span><span class="tag">${'⭐'.repeat(q.z)}</span></div>
    <div class="qtext">${esc(q.q)}</div>
    <div class="opts">${q.o.map((o,i)=>`<button class="opt ${Quiz.s.answered?(i===q.c?'correct':(i===Quiz.s.sel?'wrong':'')):''}" ${Quiz.s.answered?'disabled':''} onclick="Quiz.answer(${i})">
      <span class="key">${'ABCDE'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    ${Quiz.s.answered?`<div class="feedback">
      ${Quiz.s.sel===q.c?'✅ <b>Doğru!</b>':'❌ <b>Yanlış.</b> Doğru cevap: <b>'+esc(q.o[q.c])+'</b>'}
      <div class="tiny muted mt">${esc(q.e)}</div></div>
      <div class="btnrow mt"><button class="btn primary" onclick="Quiz.pick('${Quiz.s.mode}')">➡️ Sonraki soru</button>
        ${Quiz.s.sel!==q.c?`<button class="btn" onclick="Quiz.peekExplain()">📚 Konu tekrarı öner</button>`:''}</div>`:'<div class="hint mt">Bir şık seç.</div>'}
  </div>`:`<div class="empty mt2">Teste başlamak için yukarıdan ders seç ve “Teste başla”ya bas. Sorular sınıfına göre gelir ve aynı soru kısa sürede tekrar sorulmaz.</div>`}
  <div class="grid g2 mt2">
    <div class="card"><h3>🏁 Sınıf liderlik panosu (cihazında)</h3>
      <div class="tbl-wrap"><table class="tbl">
        <tr><th>Seviye</th><th>Kriter</th><th>Senin durumun</th></tr>

Quiz.share=function(){ const total=S.quiz.correct+S.quiz.wrong, rate=total?Math.round(S.quiz.correct/total*100):0;
  const txt=`🧠 NE YAPSAM test sonucum
Sınıf: ${S.user.grade} (${groupName(groupOf(S.user.grade))})
Doğru: ${S.quiz.correct} · Yanlış: ${S.quiz.wrong} · Başarı: %${rate}
En uzun seri: ${S.quiz.bestStreak||0} · Toplam puan: ${S.points} · Seviye: ${levelOf(S.points)}
Bugün çözdüğüm soru: ${Object.keys(S.quiz.answeredToday||{}).length}/${Quiz.targetPerDay()}`;

};
/* ---------------- Öğrenci araçları: odak/mola/oyun sayacı ---------------- */
const Study={
  toggle(){ const t=S.study.timer;
    if(t.running){ Study.settle(); t.running=false;
      if(t.mode==='study') toast('⏸️','Odak sayacı durdu','Kalan süre: '+fmtClock(t.targetMin*MS.dk-t.accum)+'. Devam edebilirsin.','',3000);

  settle(){ const t=S.study.timer; // yarıda bırakılan çalışma süresi için puan
    if(t.mode==='study'){ const un=(t.accum-(t.awarded||0)); if(un>=5*MS.dk){ addPts(Math.round(un/MS.dk),'Odaklanma süresi ('+Math.round(un/MS.dk)+' dk)','⏱️'); t.awarded=t.accum; }
      if(un>=MS.dk){ S.study.sessions.unshift({t:Date.now(),mode:'study',min:Math.round(un/MS.dk),label:'Kısmi seans'}); if(S.study.sessions.length>300) S.study.sessions.length=300; } } },
  setMode(m,min){ const t=S.study.timer; Study.settle(); t.mode=m; t.targetMin=min||t.targetMin; t.accum=0; t.awarded=0; t.warned=false; t.running=false;

    toast(m==='study'?'⏱️':m==='game'?'🎮':'☕', m==='study'?'Odak modu':m==='game'?'Oyun molası':'Dinlenme', `${min||t.targetMin} dakika ayarlandı. Başlat’a bas.`, '',3000); },
  reset(){ const t=S.study.timer; t.running=false; t.accum=0; t.awarded=0; t.warned=false; save(); App.repaintCurrent(); },
  setGoals(sMin,gMin){ S.study.goals.studyMin=+sMin||120; S.study.goals.gameMin=+gMin||60; save(); App.repaintCurrent(); toast('🎯','Hedefler güncellendi',`Günlük: ${S.study.goals.studyMin} dk çalışma · ${S.study.goals.gameMin} dk oyun`,'good',4000); },
  paintLive(){ const t=S.study.timer, d=stat();
    const el=$('#timerDisplay'), sub=$('#timerSub'), bar=$('#timerBar'), st=$('#stToday'), gm=$('#gmToday');
    const left=Math.max(0,t.targetMin*MS.dk-t.accum);
    if(el) el.textContent=t.running?fmtClock(left):fmtClock(t.accum>0?left:t.targetMin*MS.dk);
    if(sub) sub.textContent=t.running?(t.mode==='study'?'🎯 Odaklanıyorsun — telefonu uzağa koy!':t.mode==='game'?'🎮 Mola modu — süre bitince haber vereceğim':'☕ Dinlenme'):'▶️ Hazır — başlatmak için butona bas';
    if(bar) bar.style.width=pct(t.accum,t.targetMin*MS.dk).toFixed(1)+'%';
    if(st) st.textContent=Math.round(d.study||0)+' dk';
    if(gm) gm.textContent=Math.round(d.game||0)+' dk'; }
};
VIEWS.ogren=function(){
  const t=S.study.timer, d=stat(), goals=S.study.goals;
  const sessions=(S.study.sessions||[]).slice(0,10);
  const week=[]; for(let i=6;i>=0;i--){ const dd=new Date(); dd.setDate(dd.getDate()-i); const k=dateKey(dd);
    week.push({k,label:GUNLER[dd.getDay()].slice(0,3),s:(S.stats.byDate[k]&&S.stats.byDate[k].study)||0,g:(S.stats.byDate[k]&&S.stats.byDate[k].game)||0}); }

  return `

      </div>
      <div class="btnrow mt" style="justify-content:center">
        <span class="tiny muted">Odak süresi:</span>
        ${[15,25,45,60].map(m=>`<button class="btn sm ${t.mode==='study'&&t.targetMin===m?'primary':''}" onclick="Study.setMode('study',${m})">${m} dk</button>`).join('')}
      </div>
      <div class="btnrow" style="justify-content:center">
        <button class="btn sm ${t.mode==='game'?'gold':''}" onclick="Study.setMode('game',15)">🎮 15 dk oyun molası</button>
        <button class="btn sm ${t.mode==='rest'?'cyan':''}" onclick="Study.setMode('rest',10)">☕ 10 dk dinlenme</button>
      </div>
      <div class="hint mt">Tur tamamlandığında otomatik mola önerilir. Oyun molası hedefi aşarsa seni uyarır ve odak moduna döndürür.</div>
    </div>
    <div class="card">
      <h3>🎯 Günlük hedefler</h3>
      <div class="row between"><span>📚 Çalışma: <b id="stToday">${Math.round(d.study||0)} dk</b> / ${goals.studyMin} dk</span><span class="tag ${(d.study||0)>=goals.studyMin?'ok':''}">%${pct(d.study||0,goals.studyMin).toFixed(0)}</span></div>
      ${barHtml(pct(d.study||0,goals.studyMin))}
      <div class="row between mt"><span>🎮 Oyun: <b id="gmToday">${Math.round(d.game||0)} dk</b> / ${goals.gameMin} dk</span><span class="tag ${(d.game||0)>goals.gameMin?'bad':''}">%${pct(d.game||0,goals.gameMin).toFixed(0)}</span></div>
      ${barHtml(pct(d.game||0,goals.gameMin),(d.game||0)>goals.gameMin?'bad':'gold')}
      <label class="fld mt"><span>Günlük hedefleri ayarla (dakika)</span>
        <div class="row"><input type="number" id="gStudy" value="${goals.studyMin}" min="10" max="600" style="flex:1">
          <input type="number" id="gGame" value="${goals.gameMin}" min="10" max="600" style="flex:1">
          <button class="btn sm primary" onclick="Study.setGoals($('#gStudy').value,$('#gGame').value)">Kaydet</button></div></label>
      <div class="kv"><span>Bugünkü seans sayısı</span><span>${(S.study.sessions||[]).filter(x=>dateKey(x.t)===dateKey()).length}</span></div>
      <div class="kv"><span>Toplam odaklanma (tüm zamanlar)</span><span>${Math.round(totalStat('study'))} dk</span></div>
      <div class="kv"><span>Ödül kazanılan tur</span><span>${t.rounds||0}</span></div>
    </div>
  </div>
  <div class="card mt2"><h3>📊 Son 7 gün: ders vs mola</h3>
    <svg class="chart" viewBox="0 0 700 220" preserveAspectRatio="none">
      ${week.map((w,i)=>{ const x=30+i*95, hS=(w.s/mx)*150, hG=(w.g/mx)*150;
        return `<rect x="${x}" y="${175-hS}" width="34" height="${Math.max(1,hS)}" rx="6" fill="url(#gStudy)"></rect>
                <rect x="${x+38}" y="${175-hG}" width="34" height="${Math.max(1,hG)}" rx="6" fill="url(#gGame)"></rect>
                <text x="${x+36}" y="196" font-size="12" fill="currentColor" opacity=".6" text-anchor="middle">${w.label}</text>
                <text x="${x+17}" y="${170-hS}" font-size="11" fill="currentColor" opacity=".55" text-anchor="middle">${w.s?Math.round(w.s):''}</text>
                <text x="${x+55}" y="${170-hG}" font-size="11" fill="currentColor" opacity=".55" text-anchor="middle">${w.g?Math.round(w.g):''}</text>`; }).join('')}
      <defs><linearGradient id="gStudy" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
      <linearGradient id="gGame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#fbbf24"/></linearGradient></defs>
    </svg>
    <div class="legend"><span><i style="background:#7c5cff"></i>Ders/odak (${Math.round(totalStudy)} dk)</span><span><i style="background:#fbbf24"></i>Oyun & mola (${Math.round(totalGame)} dk)</span></div>
  </div>
  <div class="grid g2 mt2">
    <div class="card"><h3>🕘 Son seanslar</h3>
      <div class="list">${sessions.length?sessions.map(x=>`<div class="lr"><span>${x.mode==='study'?'📚':x.mode==='game'?'🎮':'☕'}</span>
        <div class="grow"><div class="t">${esc(x.label||'')} ${x.min} dk</div><div class="s">${fmtDateTimeTr(x.t)}</div></div></div>`).join(''):'<div class="lr"><div class="grow"><div class="s">Henüz seans yok. Bir tane başlat!</div></div></div>'}</div>
    </div>
    <div class="card"><h3>💡 Çalışma ipuçları</h3>
      <div class="list">
        <div class="lr"><span>🍅</span><div class="grow"><div class="t">25/5 kuralı</div><div class="s">25 dk çalış, 5 dk kalk ve gözünü dinlendir. 4 turdan sonra uzun mola.</div></div></div>
        <div class="lr"><span>📵</span><div class="grow"><div class="t">Telefonu başka odaya koy</div><div class="s">Odak sayacı çalışırken bildirim görmezsen verim iki katına çıkar.</div></div></div>
        <div class="lr"><span>💧</span><div class="grow"><div class="t">Su iç</div><div class="s">Her 20 dakikada bir hatırlatıcı var (sağ altta görebilirsin).</div></div></div>
        <div class="lr"><span>🧠</span><div class="grow"><div class="t">Testle pekiştir</div><div class="s">Çalıştığın konudan hemen sonra 5-10 soru çöz; kalıcılığı ciddi artırır.</div></div></div>
      </div>
      <div class="btnrow mt"><button class="btn primary sm" onclick="App.go('test')">🧠 Hemen test çöz</button>
        <button class="btn sm" onclick="Media.pick('music')">🎵 Odak müziği</button></div>
    </div>
  </div>`;
};
VIEWS.ogren.after=function(){ Study.paintLive(); };
</script>
<script>
/* =========================================================================
   Bölüm 12 — BAHÇEM: tarla ekme/sulama + ağaç sulama mini oyunu
   ========================================================================= */
const CROPS=[
 {id:'bugday',n:'Buğday',e:'🌾',dk:3,r:8,d:'Hızlı büyür, düşük puan. Başlangıç için ideal.'},
 {id:'marul',n:'Marul',e:'🥬',dk:5,r:10,d:'5 dakikada yetişir, salataya hazır.'},
 {id:'salatalik',n:'Salatalık',e:'🥒',dk:8,r:14,d:'Kısa süreli, ferah ödül.'},
 {id:'havuc',n:'Havuç',e:'🥕',dk:10,r:16,d:'Orta hızda, tatlı puan.'},
 {id:'domates',n:'Domates',e:'🍅',dk:14,r:22,d:'Bahçenin klasiği.'},
 {id:'biber',n:'Biber',e:'🌶️',dk:18,r:28,d:'Biraz acı, biraz sabır.'},
 {id:'cilek',n:'Çilek',e:'🍓',dk:22,r:34,d:'Tatlı ödül, tatlı puan.'},
 {id:'aycicegi',n:'Ayçiçeği',e:'🌻',dk:28,r:42,d:'Sabırlı olan kazanır.'},
 {id:'karpuz',n:'Karpuz',e:'🍉',dk:35,r:55,d:'En uzun süreli, en yüksek ödül.'}
];
const TREE_STAGES=[0,1,3,6,10,16,25];
function treeStageFor(days){ let st=0; for(let i=0;i<TREE_STAGES.length;i++) if(days>=TREE_STAGES[i]) st=i; return st; }
const Farm={
  crop(id){ return CROPS.find(c=>c.id===id); },
  cost(){ return 1; },
  drops(){ return S.water.drops||0; },
  regenDrops(){ S.water.dropsAt=S.water.dropsAt||Date.now();
    const dt=Date.now()-S.water.dropsAt, add=Math.floor(dt/(5*MS.dk));
    if(add>0){ S.water.drops=Math.min(12,(S.water.drops||0)+add); S.water.dropsAt=Date.now(); } },
  plant(i){
    if(S.farm.plots[i]){ toast('🌱','Burada zaten bir şey var','Önce hasat et.','warn',2600); return; }
    showModal(`<h2>🌱 ${i+1}. tarlaya ne ekelim?</h2>
      <div class="seed-grid">${CROPS.map(c=>`<div class="seed" onclick="Farm.doPlant(${i},'${c.id}')">
        <span class="se">${c.e}</span><div><div class="sn">${esc(c.n)}</div><div class="sd">${c.dk} dk · hasat +${c.r} puan</div></div></div>`).join('')}</div>
      <div class="hint mt">Sulama süreyi <b>%25 kısaltır</b> ve puan verir. Su damlası: 💧 ${Farm.drops()}/12 (içtiğin her su +2 damla, 5 dakikada 1 damla kendiliğinden gelir).</div>
      <div class="btnrow end"><button class="btn ghost" onclick="closeModal()">Kapat</button></div>`);
  },
  doPlant(i,id){ const c=Farm.crop(id); if(!c) return;
    S.farm.plots[i]={c:id,at:Date.now(),ms:c.dk*MS.dk,lastWater:null,wcount:0};
    S.farm.planted=(S.farm.planted||0)+1; stat().plant=(stat().plant||0)+1;
    const pts=(stat().plant<=12?4:1);
    addPts(pts,`${c.n} ekildi (${i+1}. tarla)`,'🌱'); sfx.water(); save(); App.checkAch(); closeModal(); App.repaintCurrent();
    toast(c.e,'Ekim tamam',`<b>${esc(c.n)}</b> ${c.dk} dakikada yetişecek. Sulamayı ihmal etme!`,'good',4000); },
  water(i){ const p=S.farm.plots[i]; if(!p) return;
    const c=Farm.crop(p.c); const today=dateKey();
    if(p.lastWater===today){ toast('💧','Bugün zaten suladın','Yarın tekrar sula.','',2600); return; }
    Farm.regenDrops();
    if((S.water.drops||0)<1){ toast('💧','Su damlası bitti','Su içerek (+2 damla) veya 5 dakika bekleyerek kazanırsın.','warn',4000); return; }
    S.water.drops-=1; p.lastWater=today; p.wcount=(p.wcount||0)+1;
    const before=p.ms; p.ms=Math.max(30000,Math.round(p.ms*0.75));
    stat().watered=(stat().watered||0)+1; S.farm.wateredTotal=(S.farm.wateredTotal||0)+1;
    addPts(2,`${c.n} sulandı (${i+1}. tarla)`,'💦'); sfx.water();
    const left=p.ms-(Date.now()-p.at);
    toast('💦','Sulama tamam',`Büyüme <b>%25 hızlandı</b>. Kalan süre: ${fmtDur(Math.max(0,left),true)}`,'water',4000);
    save(); App.checkAch(); App.repaintCurrent(); },
  harvest(i){ const p=S.farm.plots[i]; if(!p) return;
    const c=Farm.crop(p.c);
    if(Date.now()<p.at+p.ms){ toast('⏳','Henüz olgunlaşmadı',`Kalan: ${fmtDur(p.at+p.ms-Date.now(),true)}`,'warn',2600); return; }
    const bonus=p.wcount>=2?3:0;
    S.farm.plots[i]=null; S.farm.harvested=(S.farm.harvested||0)+1; stat().farm=(stat().farm||0)+1;
    addPts(c.r+bonus,`${c.n} hasat edildi${bonus?' (sulama bonusu +3)':''}`,'🧺'); sfx.harvest(); confetti(45);
    toast(c.e,'Hasat zamanı!',`<b>${esc(c.n)}</b> kazandın: +${c.r+bonus} puan. Yeni bir şey ekmek ister misin?`,'good',4200);
    save(); App.checkAch(); App.repaintCurrent(); },
  waterAll(){ let n=0; S.farm.plots.forEach((p,i)=>{ if(p&&p.lastWater!==dateKey()&&Farm.canWaterQuiet()) { Farm.water(i); n++; } });
    if(!n) toast('💧','Sulanacak bir şey yok','Ya bugün hepsi sulandı ya da damla kalmadı.','',2800); App.repaintCurrent(); },
  canWaterQuiet(){ return (S.water.drops||0)>=1; },
  plantFast(){ const empty=S.farm.plots.findIndex(p=>!p); if(empty<0){ toast('🧺','Boş tarla yok','Önce hasat et.','warn'); return; }
    const c=CROPS[Math.min(3,CROPS.length-1)]; Farm.doPlant(empty, c.id); },
  /* ---- Ağaç ---- */
  treeWateredToday(){ return S.tree.lastWaterDay===dateKey(); },
  waterTreeSuccess(strength){
    if(Farm.treeWateredToday()){ toast('🌳','Ağacı bugün suladın','Yarın tekrar sula, seri devam ediyor: '+ (S.tree.dayStreak||0) +' gün.','',2800); return; }
    const today=dateKey(); const yest=dateKey(new Date(Date.now()-MS.gun));
    S.tree.lastWaterDay=today;
    S.tree.dayStreak=(S.tree.lastWaterDayPrev===yest||S.tree.dayStreak===0)? (S.tree.dayStreak||0)+1 : 1;
    S.tree.lastWaterDayPrev=today;
    S.tree.wateredDays=(S.tree.wateredDays||0)+1; S.tree.totalWater=(S.tree.totalWater||0)+1;
    const oldStage=S.tree.stage||0, newStage=treeStageFor(S.tree.wateredDays);
    S.tree.stage=newStage;
    S.tree.fruits=Math.min(5,(S.tree.fruits||0)+(newStage>=4?1:0));
    stat().watered=(stat().watered||0)+1;
    addPts(12,`Ağaç sulandı (${S.tree.dayStreak} günlük seri)`,'🌳'); sfx.water();
    if(newStage>oldStage){ confetti(80); sfx.level();
      toast('🌳','Ağacın büyüdü!',`Seviye ${oldStage} → <b>${newStage}</b>. Sulamaya devam et!`,'good',6000); }
    else toast('🌳','Ağaç sulandı',`Seri: <b>${S.tree.dayStreak}</b> gün · Toplam sulama günü: ${S.tree.wateredDays}`,'water',4200);
    save(); App.checkAch(); App.repaintCurrent(); },
  collectFruits(){ if(!(S.tree.fruits>0)){ toast('🍎','Meyve yok','Ağacı sula, ağaç olgunlaşınca meyve verir.','',2800); return; }
    const n=S.tree.fruits; S.tree.fruits=0; addPts(n*3,`Ağaçtan ${n} meyve toplandı`,'🍎'); confetti(60); sfx.harvest();
    save(); App.checkAch(); App.repaintCurrent(); toast('🍎','Meyveler toplandı',`+${n*3} puan kazandın!`,'good',3600); },
  /* ---- Sulama mini oyunu ---- */
  mini:{on:false,pct:0,t0:0,clicks:0,timer:null,
    open(){ Farm.mini.on=true; Farm.mini.pct=12; Farm.mini.t0=Date.now(); Farm.mini.clicks=0; Farm.mini.paint();
      clearInterval(Farm.mini.timer);

    click(){ if(!Farm.mini.on) return; Farm.mini.pct=Math.min(100,Farm.mini.pct+7); Farm.mini.clicks++; sfx.click();

      const el=$('#mgBar'); if(el) el.style.width=Farm.mini.pct+'%'; },
    paint(){ const el=$('#mgBar'); if(el) el.style.width=Farm.mini.pct+'%';
      const t=$('#mgTime'); if(t) t.textContent=Math.max(0,(10-(Date.now()-Farm.mini.t0)/1000)).toFixed(1); },
    finish(auto){ Farm.mini.on=false; clearInterval(Farm.mini.timer); Farm.mini.timer=null;

    <p class="muted tiny">10 saniye içinde “Su dök” butonuna hızlıca basarak kovayı doldur. Bar %100 olursa ağaç sulanmış sayılır ve <b>+12 puan</b> kazanırsın.</p>

    <div class="bar mt" style="height:16px"><i id="mgBar" class="cyan" style="width:12%;background:linear-gradient(90deg,#0891b2,#22d3ee)"></i></div>
    <button class="btn cyan xbig block mt" onmousedown="Farm.mini.click()" ontouchstart="event.preventDefault();Farm.mini.click()">💧 SU DÖK</button>
    <div class="btnrow end mt"><button class="btn ghost" onclick="Farm.mini.finish(false)">Vazgeç</button></div>`);
    Farm.mini.open(); }
};
VIEWS.bahce=function(){
  Farm.regenDrops();
  const plots=S.farm.plots||new Array(9).fill(null);
  const drops=S.water.drops||0;
  const today=dateKey();

  const dryCount=plots.filter(p=>p&&p.lastWater!==today).length;
  return `
  ${secHead('🌱','Bahçem',`Günlük tarla ekme ve sulama mini oyunları. Hasat puan kazandırır. Zaman gerçek: bilgisayarı kapatsan bile ekinler büyümeye devam eder. Hazır: <b>${readyCount}</b> · Susuz: <b>${dryCount}</b>`)}
  <div class="grid g2">
    <div class="card">
      <div class="row between"><h3>🪴 Tarlam (9 parsel)</h3><span class="tag cy">💧 Su damlası: ${drops}/12</span></div>
      <div class="plots mt">
        ${plots.map((p,i)=>{
          if(!p) return `<div class="plot" onclick="Farm.plant(${i})"><div class="plot-bg"></div><div class="crop-emo">➕</div><div class="crop-nm">Boş ${i+1}</div><div class="tiny muted">ekmek için tıkla</div></div>`;
          const c=Farm.crop(p.c); const prog=clamp((Date.now()-p.at)/p.ms*100,0,100); const ready=prog>=100;
          return `<div class="plot ${ready?'ready':(p.lastWater!==today?'dry':'')}" onclick="Farm.${ready?'harvest':'water'}(${i})">
            <div class="plot-bg"></div>
            <div class="crop-emo">${c.e}</div>
            <div class="crop-nm">${esc(c.n)}</div>
            <div class="mini-prog"><i style="width:${prog.toFixed(0)}%"></i></div>
            <div class="tiny muted">${ready?'✅ Hasat hazır!':fmtDur(p.at+p.ms-Date.now(),true)}</div>
            ${p.lastWater!==today&&!ready?'<span class="lock" title="Susuz — tıkla ve sula">💧</span>':''}
            ${p.wcount>=2?'<span class="lock" style="left:8px;right:auto" title="Sulanmış: hasat bonusu">✨</span>':''}
          </div>`; }).join('')}
      </div>
      <div class="btnrow mt">
        <button class="btn primary sm" onclick="Farm.plantFast()">🌱 Hızlı ekim (boş tarlaya)</button>
        <button class="btn cyan sm" onclick="Farm.waterAll()">💧 Tümünü sula</button>
        <button class="btn sm" onclick="Farm.harvestAllReady()">🧺 Hazırları topla</button>
      </div>
      <div class="hint mt">Parsel tıkla: boşsa ekim menüsü, doluysa sulama, olgunlaşmışsa hasat. Sulama her gün <b>1 su damlası</b> harcar.</div>

    <div class="card">
      <h3>🌳 Ağacım</h3>
      <div class="tree-stage" id="treeStage">
        <div class="ground"></div>
        ${treeSVG(S.tree.stage,S.tree.fruits,200)}
      </div>
      <div class="row between mt">
        <div><b>Seviye ${S.tree.stage}/6</b><div class="tiny muted">${Farm.treeWateredToday()?'✅ Bugün sulandı':'💧 Bugün henüz sulanmadı'}</div></div>
        <span class="tag ${Farm.treeWateredToday()?'ok':'warn'}">🔥 ${S.tree.dayStreak||0} gün seri</span>
      </div>
      ${barHtml(pct(S.tree.wateredDays||0, 25),'green')}
      <div class="tiny muted mt">Toplam sulama günü: <b>${S.tree.wateredDays||0}</b> / 25 (son seviye) · Sıradaki seviye: ${TREE_STAGES[Math.min(6,(S.tree.stage||0)+1)]} gün</div>
      <div class="btnrow mt">
        <button class="btn cyan big" onclick="Farm.openTreeGame()">💧 Mini oyunla sula</button>
        <button class="btn green" onclick="Farm.collectFruits()">🍎 Meyveleri topla (${S.tree.fruits||0})</button>
      </div>
      <h3 class="mt2">💧 Su içme sistemi</h3>
      <div class="row between"><span class="tiny muted">Bugün içtiğin: <b>${S.water.drinks||0}</b> bardak</span>
        <span class="tag">Hatırlatıcı: her ${S.water.everyMin} dk</span></div>
      <div class="btnrow mt">
        <button class="btn cyan" onclick="Water.drink()">💧 Su içtim (+2 puan, +2 damla)</button>
        <button class="btn sm" onclick="App.go('ayarlar')">⚙️ Hatırlatıcı ayarları</button>
      </div>
      <div class="hint mt">Su içmek hem puan hem de bahçe için su damlası kazandırır: <b>günde 6 bardak</b> hedefi günlük görevini de tamamlar.</div>
    </div>
  </div>
  <div class="grid g2 mt2">
    <div class="card"><h3>📊 Bahçe istatistikleri</h3>

        <div class="statcard"><div class="v">🧺 ${S.farm.harvested||0}</div><div class="l">toplam hasat</div></div>
        <div class="statcard"><div class="v">💦 ${S.farm.wateredTotal||0}</div><div class="l">sulama</div></div>
        <div class="statcard"><div class="v">💧 ${S.water.total||0}</div><div class="l">içilen su</div></div>
      </div>
      <div class="hint mt">Hasat puanları: Buğday +8 … Karpuz +55. 2 kez sulanmış ekinlerde <b>+3 bonus</b> var.</div>
    </div>
    <div class="card"><h3>🕒 Bahçe hareketleri</h3>
      <div class="list scroll" style="max-height:250px">
        ${(S.log||[]).filter(l=>/🌱|💦|🧺|🌳|🍎|💧/.test(l.e)).slice(0,10).map(l=>`<div class="lr"><span>${l.e}</span><div class="grow"><div class="t" style="font-weight:600;font-size:.83rem">${esc(l.x)}</div><div class="s">${fmtDateTimeTr(l.t)}</div></div></div>`).join('')||'<div class="lr"><div class="grow"><div class="s">Bahçede henüz hareket yok. Bir şeyler ek! 🌱</div></div></div>'}
      </div>
    </div>
  </div>`;
};
Farm.harvestAllReady=function(){ let n=0; (S.farm.plots||[]).forEach((p,i)=>{ if(p&&Date.now()>=p.at+p.ms){ Farm.harvest(i); n++; } });
  if(!n) toast('🧺','Hazır ürün yok','Ekinlerin büyümesini bekle.','',2600); App.repaintCurrent(); };
</script>
<script>
/* =========================================================================
   Bölüm 13 — NOTLAR / GÜNLÜK + AVATAR & MAĞAZA
   ========================================================================= */
VIEWS.notlar=function(){
  const notes=S.notes||[];
  const qtext=(Notes.q||'').toLowerCase();
  const list=notes.filter(n=>!qtext||(n.t+' '+n.b).toLowerCase().includes(qtext));
  const groups={};
  list.forEach(n=>{ const k=dateKey(n.at); groups[k]=groups[k]||[]; groups[k].push(n); });
  const days=Object.keys(groups).sort().reverse();
  const wl=(S.watchlist||[]), plans=S.plans||[], pls=S.playlists||[];
  return `
  ${secHead('📓','Notlar & Günlük',`Toplam <b>${notes.length}</b> not. Her not <b>+5 puan</b> (günde ilk 5 not için). Yazdıkların yalnızca bu cihazda saklanır.`)}
  <div class="grid g2">
    <div class="card">
      <h3>✍️ Yeni not / günlük kaydı</h3>
      <label class="fld"><span>Başlık</span><input type="text" id="ntTitle" placeholder="Bugün ne oldu? / Konu başlığı" maxlength="80"></label>
      <label class="fld"><span>İçerik</span><textarea id="ntBody" placeholder="Bugün…"></textarea></label>
      <label class="fld"><span>Mod</span><select id="ntMood">
        <option>🙂 Normal</option><option>😄 Mutlu</option><option>😐 Sıradan</option><option>😔 Üzgün</option>
        <option>😤 Sinirli</option><option>😴 Yorgun</option><option>🤩 Heyecanlı</option><option>🧐 Düşünceli</option><option>😰 Endişeli</option></select></label>
      <label class="fld"><span>Etiketler (virgülle)</span><input type="text" id="ntTags" placeholder="ders, hedef, spor"></label>
      <div class="btnrow"><button class="btn primary" onclick="Notes.add()">💾 Kaydet</button>
        <button class="btn" onclick="Notes.promptQuick()">⚡ Hızlı kayıt (5 satır)</button>
        <button class="btn ghost" onclick="Notes.export()">⬇️ Tümünü indir (.txt)</button></div>
      <div class="hint mt">İpucu: günde en az 3 satır yazmak hedefini daha net görmeni sağlar. Notlar Özetler sekmesinde de sayılır.</div>
    </div>
    <div class="card">
      <div class="row between"><h3>📚 Listelerim</h3><span class="tag">${wl.length+plans.length+pls.reduce((a,p)=>a+p.songs.length,0)} kayıt</span></div>
      <div class="list">
        <div class="lr"><span>🎬</span><div class="grow"><div class="t">İzleme listem</div><div class="s">${wl.filter(w=>!w.done).length} bekliyor · ${wl.filter(w=>w.done).length} tamamlandı</div></div><div class="a"><button class="btn sm" onclick="App.go('izle')">Aç</button></div></div>
        <div class="lr"><span>🎮</span><div class="grow"><div class="t">Favori oyunlarım</div><div class="s">${(S.favGames||[]).length} oyun</div></div><div class="a"><button class="btn sm" onclick="App.go('oyun_yok')">Aç</button></div></div>
        <div class="lr"><span>🎵</span><div class="grow"><div class="t">Çalma listelerim</div><div class="s">${pls.length} liste · ${pls.reduce((a,p)=>a+p.songs.length,0)} şarkı</div></div><div class="a"><button class="btn sm" onclick="App.go('dinle')">Aç</button></div></div>
        <div class="lr"><span>🗺️</span><div class="grow"><div class="t">Gezi planlarım</div><div class="s">${plans.map(p=>p.city).join(', ')||'plan yok'}</div></div><div class="a"><button class="btn sm" onclick="App.go('gezi')">Aç</button></div></div>
        <div class="lr"><span>🍽️</span><div class="grow"><div class="t">Favori tarifler</div><div class="s">${(S.favFoods||[]).join(', ')||'yok'}</div></div><div class="a"><button class="btn sm" onclick="App.go('yesem')">Aç</button></div></div>
      </div>
    </div>
  </div>
  <div class="card mt2">
    <div class="row between"><h3>🗂️ Notlarım (${list.length})</h3>
      <input type="search" id="searchNotes" autocomplete="off" style="max-width:260px" placeholder="Notlarında ara…" value="${esc(Notes.q||'')}" oninput="Notes.searchLive(this.value,this.id)"></div>
    ${days.length? days.map(k=>`<div class="mt">
        <div class="row between"><b>${fmtDateTr(keyToDate(k).getTime())} · ${GUNLER[keyToDate(k).getDay()]}</b>
          <span class="tiny muted">${groups[k].length} not</span></div>
        <div class="list mt">${groups[k].map(n=>{
          const idx=(S.notes||[]).indexOf(n);
          return `<div class="lr"><span>${esc((n.m||'🙂').split(' ')[0])}</span><div class="grow">
            <div class="t">${esc(n.t||'(başlıksız)')}</div>
            <div class="s" style="white-space:pre-wrap">${esc((n.b||'').slice(0,220))}${(n.b||'').length>220?'…':''}</div>
            ${n.tags&&n.tags.length?`<div class="tags">${n.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>`:''}
            <div class="s">${fmtDateTimeTr(n.at)} · ${(n.b||'').trim().split(/\s+/).filter(Boolean).length} kelime</div></div>
            <div class="a"><button class="btn sm" onclick="Notes.open(${idx})">Aç</button>
              <button class="btn sm red" onclick="Notes.del(${idx})">✕</button></div></div>`; }).join('')}</div>
      </div>`).join('') : '<div class="empty mt">Not yok. Soldaki formu kullanarak ilk notunu yaz! ✍️</div>'}
  </div>`;
};
const Notes={
  q:'',
  searchLive(v,id){ Notes.q=v; clearTimeout(Notes._t);
    Notes._t=setTimeout(()=>{ try{ App.repaintCurrent(); }catch(e){}
      try{ const el=document.getElementById(id||'searchNotes'); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } }catch(e){} },260); },
  add(){ if(!$('#ntTitle')||!$('#ntBody')){ toast('📝','Not formu açık değil','Notlar sekmesine git ve formu kullan.','warn',3000); return; }
    const t=$('#ntTitle').value.trim(), b=$('#ntBody').value.trim(), m=$('#ntMood').value;
    const tags=$('#ntTags').value.split(',').map(x=>x.trim()).filter(Boolean);
    if(!t&&!b){ toast('⚠️','Boş not','Başlık veya içerik yazmalısın.','warn',2500); return; }
    Notes.push(t||'(başlıksız)',b,m,tags);
    $('#ntTitle').value=''; $('#ntBody').value=''; $('#ntTags').value=''; App.repaintCurrent(); },
  push(t,b,m,tags){ const n=(stat().notes||0)+1; stat().notes=n;
    S.notes.unshift({t,b,m,tags,at:Date.now()});
    const pts=n<=5?5:1; addPts(pts,'Not eklendi: '+(t||'günlük'),'📝');
    save(); App.checkAch(); toast('💾','Not kaydedildi',`+${pts} puan · toplam ${S.notes.length} not`,'good',3000); },
  promptQuick(){ showModal(`<h2>⚡ Hızlı günlük kaydı</h2>
    <p class="muted tiny">Sadece bugün hissettiğin şeyi yaz. Başlık otomatik: ${fmtDateTr(Date.now())} ${GUNLER[new Date().getDay()]}</p>
    <textarea id="qkBody" placeholder="Bugün…"></textarea>
    <div class="btnrow mt end"><button class="btn ghost" onclick="closeModal()">Vazgeç</button>
    <button class="btn primary" onclick="Notes.quickSave()">Kaydet</button></div>`); },
  quickSave(){ const b=$('#qkBody').value.trim(); if(!b){ toast('⚠️','Boş','Bir şeyler yaz.','warn',2200); return; }
    Notes.push(fmtDateTr(Date.now())+' '+GUNLER[new Date().getDay()],b,'🙂',['günlük']); closeModal(); App.repaintCurrent(); },
  open(i){ const n=S.notes[i]; if(!n) return;
    showModal(`<h2>${esc(n.m||'🙂')} ${esc(n.t||'')}</h2>
      <div class="tiny muted">${fmtDateTimeTr(n.at)} · ${(n.b||'').trim().split(/\s+/).filter(Boolean).length} kelime</div>
      <div class="feedback" style="white-space:pre-wrap">${esc(n.b||'')}</div>
      ${n.tags&&n.tags.length?`<div class="tags">${n.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}</div>`:''}
      <div class="btnrow mt end"><button class="btn sm red" onclick="Notes.del(${i});closeModal()">Sil</button>
      <button class="btn sm" onclick="Notes.copy(${i})">📋 Kopyala</button>
      <button class="btn" onclick="closeModal()">Kapat</button></div>`); },
  copy(i){ const n=S.notes[i]; if(!n) return; copyText(`${n.t}\n${n.b}`,'Not: '+(n.t||''),'not.txt'); },
  del(i){ const n=S.notes[i]; if(!n) return; S.notes.splice(i,1); save(); App.repaintCurrent(); toast('🗑️','Not silindi',esc(n.t||''),'',2400); },
  export(){ const lines=(S.notes||[]).slice().reverse().map(n=>`[${fmtDateTimeTr(n.at)}] ${n.m||''} ${n.t}\n${n.b}\n${n.tags&&n.tags.length?'#'+n.tags.join(' #'):''}\n`).join('\n---\n');
    Save.text('ne-yapsam-notlarim.txt',`NE YAPSAM? · NOTLARIM (${fmtDateTr(Date.now())})\n\n${lines||'(boş)'}`,'text/plain;charset=utf-8','Notlarım (.txt)'); }
};
/* ===================== AVATAR & MAĞAZA ===================== */
const Shop={
  cat:'hat',
  buy(cat,id){ const it=findItem(cat,id); if(!it) return;
    if(S.owned.includes(id)){ Shop.equip(cat,id); return; }
    if(S.points<it.pr){ toast('🪙','Yetersiz puan',`Bu ürün <b>${it.pr}</b> puan, sende <b>${S.points}</b> puan var. Görev yaparak veya test çözerek puan kazan.`,'warn',4500); return; }
    S.points-=it.pr; S.owned.push(id); Shop.equip(cat,id);
    logAct('🛍️',`Satın alındı: ${it.n} (-${it.pr} puan)`); sfx.coin(); confetti(45);
    toast('🛍️','Satın alma tamam!',`<b>${esc(it.n)}</b> artık senin. (-${it.pr} puan)`,{},{},'good'); save(); App.checkAch(); App.repaintCurrent(); },
  equip(cat,id){ S.equipped[cat]=id; const it=findItem(cat,id);
    save(); toast('✅','Kuşandın',`${esc(it.n)} aktif.`,'good',2600); App.repaintCurrent(); },
  surprise(){ if(S.points<120){ toast('🪙','Yetersiz puan','Sürpriz kutu 120 puan.','warn',2600); return; }
    S.points-=120; const pool=Object.keys(COSMETICS).flatMap(c=>COSMETICS[c].filter(x=>!S.owned.includes(x.id)).map(x=>({cat:c,item:x})));
    if(!pool.length){ S.points+=60; toast('🎁','Koleksiyon tamam!','Tüm kozmetikler sende. 60 puan iade edildi.','good',4200); }
    else { const p=pick(pool); S.owned.push(p.item.id); logAct('🎁',`Sürpriz kutudan: ${p.item.n}`);
      sfx.level(); confetti(70); toast('🎁','Sürpriz!',`Kutudan <b>${esc(p.item.n)}</b> çıktı!`,{},{},'good',6000); }
    save(); App.checkAch(); App.repaintCurrent(); },
  png(){ try{
      const svg=$('#avatarSvg'); if(!svg) return;
      const ser=new XMLSerializer().serializeToString(svg);
      const w=420,h=470, cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const ctx=cv.getContext('2d'); if(!ctx){ toast('⚠️','PNG oluşturulamadı','Bu tarayıcı canvas desteklemiyor.','warn',3500); return; }
      const g=ctx.createLinearGradient(0,0,w,h);
      const bg=findItem('bg',S.equipped.bg||'bg_default'); g.addColorStop(0,'#1a1030'); g.addColorStop(1,'#0b0d17');
      ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
      const img=new Image();
      img.onload=()=>{ ctx.drawImage(img,w/2-160,40,320,352); ctx.fillStyle='#fff'; ctx.font='bold 22px sans-serif'; ctx.textAlign='center';
        ctx.fillText((S.user.name||'Oyuncu')+' · Lv '+levelOf(S.points),w/2,h-24);
        const data=cv.toDataURL('image/png');
        if(inFrame()){ Save.pending={filename:'avatarim.png',content:data,mime:'image/png',label:'Avatarım (PNG)'}; Save.modal(); }
        else { Save.pending={filename:'avatarim.png',content:data,mime:'image/png',label:'Avatarım (PNG)'};
          const ok=download('avatarim.png',data,'image/png');
          toast(ok?'🖼️':'⚠️', ok?'Avatar indirildi':'İndirme engellendi', ok?'avatarim.png olarak kaydedildi.':'Resmi pencerede açtım; uzun basıp kaydedebilirsin.','',3400);
          if(!ok) Save.modal(); } };
      img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(ser)));
    }catch(e){ toast('⚠️','İndirme başarısız',esc(e.message),'warn',4000); } }
};
VIEWS.avatar=function(){
  const eq=S.equipped||{}, li=levelInfo(S.points);

<script>
/* =========================================================================
   Bölüm 14 — ÖZETLER + AYARLAR + BAŞLATMA
   ========================================================================= */
function sumRange(fromTs,toTs,key){ let t=0;
  for(const k in S.stats.byDate){ const ts=keyToDate(k).getTime(); if(ts>=fromTs&&ts<=toTs) t+=(S.stats.byDate[k][key]||0); }
  return t; }
function rangeStart(kind){
  const d=new Date(); d.setHours(0,0,0,0);
  if(kind==='today') return d.getTime();
  if(kind==='week'){ const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return d.getTime(); }
  if(kind==='month'){ d.setDate(1); return d.getTime(); }
  if(kind==='year'){ d.setMonth(0,1); return d.getTime(); }
  return d.getTime(); }
function periodStats(kind){ const from=rangeStart(kind), to=Date.now();
  return {study:sumRange(from,to,'study'),game:sumRange(from,to,'game'),quiz:sumRange(from,to,'quiz'),water:sumRange(from,to,'water'),
          farm:sumRange(from,to,'farm'),notes:sumRange(from,to,'notes'),tasks:sumRange(from,to,'tasks'),pts:sumRange(from,to,'pts')}; }
VIEWS.ozet=function(){
  const t=periodStats('today'), w=periodStats('week'), m=periodStats('month'), y=periodStats('year');
  const yearSel=Ozet.year||new Date().getFullYear();
  const months=AYLAR.map((ad,i)=>{ let st=0,gm=0,qz=0;
    for(const k in S.stats.byDate){ const d=keyToDate(k); if(d.getFullYear()===yearSel&&d.getMonth()===i){ st+=S.stats.byDate[k].study||0; gm+=S.stats.byDate[k].game||0; qz+=S.stats.byDate[k].quiz||0; } }
    return {ad,st,gm,qz}; });
  const yTot={ study:months.reduce((a,x)=>a+x.st,0), game:months.reduce((a,x)=>a+x.gm,0), quiz:months.reduce((a,x)=>a+x.qz,0) };
  const mxM=Math.max(30,...months.map(x=>Math.max(x.st,x.gm)));
  const dayCount=Object.keys(S.stats.byDate).length;
  const cards=[['Bugün',t],['Bu hafta',w],['Bu ay',m],['Bu yıl',y]];
  const now=new Date(); const y0=new Date(now.getFullYear(),now.getMonth(),1); const daysIn=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const firstDow=(y0.getDay()+6)%7;
  const cal=[]; for(let i=0;i<firstDow;i++) cal.push(null);
  for(let d=1;d<=daysIn;d++){ const k=dateKey(new Date(now.getFullYear(),now.getMonth(),d)); const st=S.stats.byDate[k];
    const score=st?((st.study||0)+(st.quiz||0)*2+(st.water||0)*3+(st.farm||0)*5):0;
    cal.push({d,k,score}); }
  const maxScore=Math.max(1,...cal.filter(Boolean).map(c=>c.score));
  return `
  ${secHead('📊','Özetlerim',`Ne kadar ilerlediğini gör: günlük, haftalık, aylık ve yıllık özetler. Kullanılan gün sayısı: <b>${dayCount}</b> · En uzun seri: <b>${S.streak.best||0}</b> gün`)}
  <div class="grid g2">
    ${cards.map(([ad,s])=>`<div class="card"><h3>${ad}</h3>
      <div class="kv"><span>⏱️ Odaklanma</span><span>${Math.round(s.study)} dk</span></div>
      <div class="kv"><span>🎮 Oyun & mola</span><span>${Math.round(s.game)} dk</span></div>
      <div class="kv"><span>🧠 Çözülen soru</span><span>${Math.round(s.quiz)}</span></div>
      <div class="kv"><span>💧 İçilen su</span><span>${Math.round(s.water)} bardak</span></div>
      <div class="kv"><span>🧺 Hasat</span><span>${Math.round(s.farm)}</span></div>
      <div class="kv"><span>📝 Not</span><span>${Math.round(s.notes)}</span></div>
      <div class="kv"><span>🪙 Kazanılan puan</span><span>${TL(s.pts)}</span></div>
    </div>`).join('')}
  </div>
  <div class="card mt2">
    <div class="row between"><h3>📅 ${now.getFullYear()} ${AYLAR[now.getMonth()]} takvimi</h3>
      <span class="tiny muted">Kutunun koyuluğu o günkü aktiviteyi gösterir</span></div>
    <div class="cal mt">${['Pt','Sa','Ça','Pe','Cu','Ct','Pa'].map(g=>`<div class="c" style="background:transparent;color:var(--tx3)">${g}</div>`).join('')}
      ${cal.map(c=>c?`<div class="c ${c.score>maxScore*0.66?'h3':c.score>maxScore*0.33?'h2':c.score>0?'h1':''} ${c.k===dateKey()?'today':''}" title="${c.k} · aktivite ${c.score.toFixed(0)}">${c.d}</div>`:'<div class="c" style="opacity:.25"></div>').join('')}
    </div>
  </div>
  <div class="card mt2">
    <div class="row between"><h3>📈 ${yearSel} yılı aylık özet</h3>
      <select style="max-width:140px" onchange="Ozet.year=+this.value;App.repaintCurrent()">
        ${Array.from({length:4},(_,i)=>new Date().getFullYear()-i).map(yy=>`<option ${yy===yearSel?'selected':''}>${yy}</option>`).join('')}</select></div>
    <svg class="chart" viewBox="0 0 700 230" preserveAspectRatio="none">
      ${months.map((x,i)=>{ const bx=25+i*56;
        const hS=(x.st/mxM)*150, hG=(x.gm/mxM)*150;
        return `<rect x="${bx}" y="${180-hS}" width="22" height="${Math.max(1,hS)}" rx="5" fill="url(#yS)"></rect>
                <rect x="${bx+24}" y="${180-hG}" width="22" height="${Math.max(1,hG)}" rx="5" fill="url(#yG)"></rect>
                <text x="${bx+23}" y="200" font-size="11" fill="currentColor" opacity=".6" text-anchor="middle">${x.ad.slice(0,3)}</text>`; }).join('')}
      <defs><linearGradient id="yS" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4b2ee0"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
      <linearGradient id="yG" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#b45309"/><stop offset="1" stop-color="#fbbf24"/></linearGradient></defs>
    </svg>
    <div class="legend"><span><i style="background:#7c5cff"></i>Odak ${Math.round(yTot.study)} dk</span><span><i style="background:#fbbf24"></i>Oyun ${Math.round(yTot.game)} dk</span></div>
    <div class="statcards mt">
      <div class="statcard"><div class="v">${Math.round(yTot.study/60)}</div><div class="l">${yearSel} saat odak</div></div>
      <div class="statcard"><div class="v">${yTot.quiz}</div><div class="l">${yearSel} çözülen soru</div></div>
      <div class="statcard"><div class="v">${months.reduce((a,x)=>a+(x.st>x.gm?1:0),0)}</div><div class="l">dengeli ay (ders≥oyun)</div></div>
      <div class="statcard"><div class="v">${Math.round(yTot.study/Math.max(1,yTot.game)*100)/100}</div><div class="l">ders/oyun oranı</div></div>
    </div>
    <div class="feedback mt">📌 <b>${yearSel} özetin:</b> ${Math.round(yTot.study)} dakika odaklandın, ${yTot.quiz} soru çözdün, ${Math.round(yTot.game)} dakika mola verdin. ${enAktifAy(months)} en verimli ayın oldu. ${yTot.study>=60?'Böyle devam! 🚀':'Hedeflerini küçük tutup her gün 25 dakika çalışmayı dene. 💪'}</div>
    <div class="btnrow mt"><button class="btn primary sm" onclick="Ozet.copy(${yearSel})">📋 Yıllık özeti kopyala</button>
      <button class="btn sm" onclick="Ozet.download(${yearSel})">⬇️ Raporu indir (.txt)</button>
      <button class="btn sm cyan" onclick="Ozet.print()">🖨️ Yazdır / PDF</button></div>
  </div>
  <div class="grid g2 mt2">
    <div class="card"><h3>🏆 Rekorların</h3>
      <div class="kv"><span>🔥 En uzun günlük seri</span><span>${S.streak.best||0} gün</span></div>
      <div class="kv"><span>🧠 En uzun doğru serisi</span><span>${S.quiz.bestStreak||0}</span></div>
      <div class="kv"><span>⏱️ Toplam odaklanma</span><span>${fmtDur(totalStat('study')*MS.dk)}</span></div>
      <div class="kv"><span>🎮 Toplam mola</span><span>${fmtDur(totalStat('game')*MS.dk)}</span></div>
      <div class="kv"><span>💧 Toplam su</span><span>${S.water.total||0} bardak (${TL((S.water.total||0)*0.25)} L)</span></div>
      <div class="kv"><span>🧺 Toplam hasat</span><span>${S.farm.harvested||0} ürün</span></div>
      <div class="kv"><span>📍 Gezilen il</span><span>${(S.visitedCities||[]).length}/81</span></div>
      <div class="kv"><span>⌛ Uygulamada geçen süre</span><span>${fmtDur(S.seen.totalMs+ (Date.now()-(S.seen.lastMaintain||Date.now())))}</span></div>
      <div class="kv"><span>👀 Ziyaret sayısı</span><span>${S.seen.visits||1}</span></div>
    </div>
    <div class="card"><h3>🗓️ Bugünün özeti</h3>
      <div class="feedback">${Ozet.dayStory()}</div>
      <div class="btnrow mt"><button class="btn sm" onclick="App.go('home')">🏠 Ana sayfaya dön</button>
        <button class="btn sm gold" onclick="Media.pick('games')">🎮 Ödül: bir oyun önerisi al</button></div>
      <h3 class="mt2">🧾 Son aktiviteler</h3>
      <div class="list scroll" style="max-height:220px">
        ${(S.log||[]).slice(0,12).map(l=>`<div class="lr"><span>${l.e}</span><div class="grow"><div class="t" style="font-weight:600;font-size:.82rem">${esc(l.x)}</div><div class="s">${fmtDateTimeTr(l.t)}</div></div></div>`).join('')||'<div class="lr"><div class="grow"><div class="s">Hareket yok.</div></div></div>'}
      </div>
    </div>
  </div>`;
};
function enAktifAy(months){ let best=months[0]; months.forEach(m=>{ if(m.st>best.st) best=m; }); return best.st>0?best.ad+' ayı':'Henüz bir ay'; }
const Ozet={
  year:new Date().getFullYear(),
  dayStory(){ const d=stat(); const parts=[];
    parts.push(`Bugün ${Math.round(d.study||0)} dakika odaklandın`);
    if(d.quiz) parts.push(`${d.quiz} soru çözdün`); else parts.push('henüz test çözmedin');
    parts.push(`${d.water||0} bardak su içtin`);
    if(d.farm) parts.push(`${d.farm} ürün hasat ettin`);
    if(d.notes) parts.push(`${d.notes} not yazdın`);
    const streak=S.streak.count||0;
    return parts.join(', ')+'. '+(streak>1?`🔥 ${streak} günlük serini sürdürüyorsun!`:'Yarın da devam edersen seri başlar. 💪'); },
  text(yy){ const months=AYLAR.map((ad,i)=>{ let st=0,gm=0,qz=0;
      for(const k in S.stats.byDate){ const d=keyToDate(k); if(d.getFullYear()===yy&&d.getMonth()===i){ st+=S.stats.byDate[k].study||0; gm+=S.stats.byDate[k].game||0; qz+=S.stats.byDate[k].quiz||0; } }
      return {ad,st:Math.round(st),gm:Math.round(gm),qz}; });
    const tot={st:months.reduce((a,x)=>a+x.st,0),gm:months.reduce((a,x)=>a+x.gm,0),qz:months.reduce((a,x)=>a+x.qz,0)};
    return `📊 NE YAPSAM? · ${yy} YILLIK ÖZET (${fmtDateTr(Date.now())})
Kullanıcı: ${S.user.name||'Kullanıcı'} · Şehir: ${S.user.city||'-'}
─────────────────────────
Toplam odaklanma   : ${tot.st} dk (${Math.round(tot.st/60)} saat)
Toplam mola/oyun   : ${tot.gm} dk
Çözülen soru       : ${tot.qz}
Doğru / yanlış     : ${S.quiz.correct} / ${S.quiz.wrong}
İçilen su          : ${S.water.total||0} bardak
Hasat              : ${S.farm.harvested||0} ürün · Ağaç seviyesi ${S.tree.stage}/6
Not                : ${(S.notes||[]).length} kayıt
Gezilen il         : ${(S.visitedCities||[]).length}/81
En uzun seri       : ${S.streak.best||0} gün
Toplam puan        : ${TL(S.points)} · Seviye ${levelOf(S.points)}
Başarım            : ${S.seenBadges.length}/${ACH.length}
─────────────────────────
AYLIK DÖKÜM (dk odak / dk mola / soru)
${months.map(m=>`${m.ad.padEnd(8,' ')}: ${String(m.st).padStart(4,' ')} / ${String(m.gm).padStart(4,' ')} / ${m.qz}`).join('\n')}`; },
  copy(yy){ copyText(Ozet.text(yy),'Yıllık özet','ne-yapsam-ozet-'+yy+'.txt'); },
  download(yy){ Save.text(`ne-yapsam-ozet-${yy}.txt`,Ozet.text(yy),'text/plain;charset=utf-8',`${yy} yıllık özet`); },
  print(){ if(inFrame()) toast('🖨️','Yazdırma penceresi','Önizleme penceresi yazdırmayı engelleyebilir. Dosyayı indirip tarayıcıda açtığında Yazdır / PDF sorunsuz çalışır.','warn',5200);
    try{ window.print(); }catch(e){ toast('⚠️','Yazdırılamadı','Tarayıcı yazdırmaya izin vermedi.','warn',3200); } }
};

const Ayar={
  setWater(m){ S.water.everyMin=+m; S.water.nextAt=Date.now()+m*MS.dk; save(); Water.renderWaterHud(); App.repaintCurrent();
    toast('💧','Hatırlatma aralığı güncellendi',`Her ${m} dakikada bir uyaracağım.`,{},{},'good'); },
  setAlarm(){ const v=$('#alTime').value, label=$('#alLabel').value.trim(), daily=$('#alDaily').checked;
    if(!v){ toast('⚠️','Saat seç','Alarm için bir saat gir.','warn'); return; }
    const [hh,mm]=v.split(':').map(Number); const d=new Date(); d.setHours(hh,mm,0,0);
    if(d.getTime()<=Date.now()) d.setDate(d.getDate()+1);
    S.alarm={at:d.getTime(),label:label||'Alarm',on:true,daily};
    save(); App.repaintCurrent(); sfx.ok();
    toast('⏰','Alarm kuruldu',`<b>${esc(S.alarm.label)}</b> · ${new Date(S.alarm.at).toLocaleString('tr-TR')}${daily?' (her gün)':''} · Uygulama açıkken çalar.`,'good',6000); },
  clearAlarm(){ S.alarm={at:null,label:'',on:false,daily:false}; save(); App.repaintCurrent(); toast('🔕','Alarm kapatıldı','','',2400); },
  export(){ Save.text('ne-yapsam-yedek-'+dateKey()+'.json',JSON.stringify(S,null,1),'application/json','Yedek dosyası (.json)'); },
  import(input){ const f=input.files&&input.files[0]; if(!f) return;
    /* Görsel geri yükleme (Bölüm 20): logo / arka plan resmi seçilirse onu işle */
    if(/^image\//.test(f.type) && window.ImgBil && ImgBil.canHandle(f.type,f.size)){
      const ri=new FileReader(); ri.onload=()=>{ ImgBil.read(f.type,f.size,String(ri.result)); };
      ri.onerror=()=>toast('⚠️','Görsel okunamadı','Dosyayı tekrar seçmeyi dene.','warn',3200);
      ri.readAsDataURL(f); try{ input.value=''; }catch(e){} return; }
    const r=new FileReader(); r.onload=()=>{ try{ const data=JSON.parse(r.result);
        S=deepMerge(defaultState(),data); Store.set(LS_KEY,JSON.stringify(S)); save(true);
        toast('✅','Yedek geri yüklendi','Sayfayı yeniliyorum…','good',2500); setTimeout(()=>location.reload(),900);
      }catch(e){ toast('⚠️','Dosya okunamadı',esc(e.message),'warn',4000); } };
    r.readAsText(f); },
  pasteImport(){ showModal(`<h2>⬆️ Yedeği yapıştır</h2>
      <p class="tiny muted">Telefonda ya da önizleme penceresinde dosya seçici çalışmazsa, yedek dosyasının içeriğini buraya yapıştır.</p>
      <label class="fld"><span>Yedek içeriği (JSON)</span><textarea id="impText" rows="8" placeholder='{"v":1, ...}'></textarea></label>

      <button class="btn primary" onclick="Ayar.applyImport()">✅ Geri yükle</button></div>`);
    setTimeout(()=>{ const el=$('#impText'); if(el) el.focus(); },80); },
  applyImport(){ const el=$('#impText'); if(!el) return; const txt=(el.value||'').trim();
    if(!txt){ toast('⚠️','Boş alan','Yedek içeriğini yapıştır.','warn',2600); return; }
    try{ const data=JSON.parse(txt); if(!data||typeof data!=='object') throw new Error('Geçersiz veri');
      S=deepMerge(defaultState(),data); Store.set(LS_KEY,JSON.stringify(S)); save(true); closeModal();
      toast('✅','Yedek geri yüklendi','Sayfayı yeniliyorum…','good',2500); setTimeout(()=>{ try{ location.reload(); }catch(e){} },900);
    }catch(e){ toast('⚠️','Okunamadı','Yedek metni bozuk görünüyor: '+esc(e.message),'warn',4200); } },
  resetAll(){ confirmBox('Tüm veriler (puanlar, notlar, bahçe, istatistikler) silinecek. Bu işlem geri alınamaz!').then(ok=>{
      if(!ok) return; Store.del(LS_KEY); S=defaultState(); Store.set(LS_KEY,JSON.stringify(S));
      toast('🗑️','Sıfırlandı','Uygulama yeniden başlatılıyor…','warn',2200); setTimeout(()=>location.reload(),800); }); }
};

var Price19 = {

             '37':'Gamivo','38':'Plitch','39':'GameStop','40':'Ziff Davis'},
  fetchJSON(url, ms){

    return self.fetchJSON('https://www.cheapshark.com/api/1.0/stores', 5000).then(function(list){

/* ---------- öneriler: grup/paket yerine tek somut içerik ---------- */
function p19_candidates(kind){
  /* filtreler 67.905 öğelik havuzun tamamıyla çalışsın */
  return _p19_cand(kind) || [];
}
var _p19_cand = Media.candidates;
Media.candidates = p19_candidates;

function p19_concretize(kind, it){
  if(!it || !it.gen || !it.lq) return it;
  var arr = kind === 'games' ? GAMES : (kind === 'film' ? MOVIES : null);
  if(!arr) return it;
  var lq = String(it.lq), found = null;
  for(var i = 0; i < arr.length; i++){
    var x = arr[i];
    if(x.gen) continue;
    if(x.n === lq){ found = x; break; }
    if(!found && x.n.indexOf(lq) >= 0) found = x;
  }
  /* oyun paketlerinde: içeriğin platformu paketin platformuyla uyuşmuyorsa
     aynı tür + aynı platformdan gerçek bir oyun seç (filtre sözü bozulmasın) */
  if(kind === 'games' && found && it.p && found.p !== it.p){
    var alt = GAMES.filter(function(x){ return !x.gen && x.p === it.p && x.g === it.g; });
    if(!alt.length) alt = GAMES.filter(function(x){ return !x.gen && x.p === it.p; });
    if(alt.length) found = alt[Math.floor(Math.random() * alt.length)];
  }
  if(!found) return it;
  var out = Object.assign({}, found);
  out.fromPack = it.n;
  if(it.f && !out.f) out.f = 1;
  return out;
}
var _p19_rand = Media.rand;
Media.rand = function(kind){
  var it = _p19_rand(kind);
  if(!it || !it.gen) return it;                      /* zaten somut içerik */
  if(kind === 'city') return it;                      /* rotalar/iller somut */
  var concrete = p19_concretize(kind, it);            /* paketin işaret ettiği gerçek içerik */
  if(concrete && !concrete.gen) return concrete;
  /* paket çözülemediyse gerçek içerikten seç */
  var real = (_p19_cand(kind) || []).filter(function(x){ return !x.gen; });
  if(!real.length) return it;
  var seen = (S.prefs && S.prefs.mediaP && S.prefs.mediaP[kind]) || [];
  var key = function(x){ return x.n || (x.a + ' - ' + x.s); };
  var fresh = real.filter(function(x){ return seen.indexOf(key(x)) < 0; });
  var pool = fresh.length ? fresh : real;
  var pickIt = pool[Math.floor(Math.random() * pool.length)];
  try{ S.prefs.mediaP[kind] = [key(pickIt)].concat(seen).slice(0, 25); save(); }catch(e){}
  return pickIt;
};

};

function p19_shade(hex, amt){
  try{
    var c = String(hex).replace('#', '');
    if(c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
    var n = parseInt(c, 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    function f(v){ var x = Math.round(v + 255 * amt); return Math.max(0, Math.min(255, x)); }
    return '#' + ((1 << 24) + (f(r) << 16) + (f(g) << 8) + f(b)).toString(16).slice(1);
  }catch(e){ return hex; }
}

   1) USD fiyatların yanında güncel kur ile yaklaşık TL karşılığı
   2) "Başka nerede satılıyor?" paneline 12 mağazalık TL bölümü
   3) Steam mağaza kimliği bulununca tam ürün sayfasına (cc=tr) geçiş

/* ---------- 1) kur: USD → TRY (günde bir kez, çevrimdışıysa önbellek) ---------- */
var P19C_FX = {rate: null, at: 0, src: 'kur', busy: false};
function p19c_tl(usd){
  var n = parseFloat(usd);
  if(!isFinite(n) || n <= 0 || !P19C_FX.rate) return '';
  var tl = n * P19C_FX.rate;
  return (tl >= 100 ? Math.round(tl).toLocaleString('tr-TR') : tl.toFixed(2)) + ' ₺';
}
function p19c_loadFx(force){
  try{
    var c = JSON.parse(localStorage.getItem('neyapsam_fx') || 'null');
    if(c && c.rate && c.at && !force && (Date.now() - c.at) < 12 * 3600 * 1000){
      P19C_FX.rate = c.rate; P19C_FX.at = c.at; P19C_FX.src = 'kur (önbellek)';
      return Promise.resolve(c.rate);
    }
  }catch(e){}
  if(P19C_FX.busy) return Promise.resolve(P19C_FX.rate);
  P19C_FX.busy = true;
  return fetch('https://open.er-api.com/v6/latest/USD', {cache: 'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(j){
      var rate = j && j.rates && j.rates.TRY;
      if(rate){
        P19C_FX.rate = rate; P19C_FX.at = Date.now(); P19C_FX.src = 'kur';
        try{ localStorage.setItem('neyapsam_fx', JSON.stringify({rate: rate, at: P19C_FX.at})); }catch(e){}
      }
      P19C_FX.busy = false;
      return P19C_FX.rate;
    })
    .catch(function(){ P19C_FX.busy = false; return P19C_FX.rate; });
}
try{ p19c_loadFx().then(function(){ try{ p19c_tl_refresh(); }catch(e){} }); }catch(e){}

var _p19c_lookup = Price19.lookup;
Price19.lookup = function(title){

  return _p19c_lookup.call(Price19, nm).then(function(res){
    if(res && res.steamAppID){ window.P19C_APPID[Price19.norm(nm)] = res.steamAppID; p19c_steamBtn(nm, res.steamAppID); }
    if(res && res.cheapest) p19c_tl_refresh();
    return res;
  });
};
/* Steam oyunuysa ve ürün kimliği bulunduysa birincil düğmeyi tam sayfaya çevir */

  var m = Media.last && Media.last.games;

/* ---------- 3) TL karşılığını modal satırına işle ---------- */
function p19c_tl_refresh(){
  var box = document.getElementById('price19');
  if(!box || !P19C_FX.rate) return;
  var row = box.querySelector('.p19c-tl');
  var usd = box.getAttribute('data-usd');
  if(!usd) return;
  var txt = '≈ <b>' + p19c_tl(usd) + '</b> <span class="tiny muted">(USD × ' + P19C_FX.rate.toFixed(2) + ' kur ile yaklaşık) · kur tarihi: ' + new Date(P19C_FX.at).toLocaleString('tr-TR') + '</span>';
  if(row){ row.innerHTML = txt; }
  else{
    row = document.createElement('div');
    row.className = 'p19c-tl tiny mt';
    row.innerHTML = txt;
    var anchor = box.querySelector('.tiny.muted.mt');
    if(anchor && anchor.parentNode === box) box.insertBefore(row, anchor); else box.appendChild(row);
  }
}
var _p19c_dealsHtml = Price19.dealsHtml;
Price19.dealsHtml = function(res){

  if(isFinite(usd) && usd > 0){
    var box = document.getElementById('price19');
    if(box) box.setAttribute('data-usd', usd);

};

  var L = null; P19C_LOOKS.forEach(function(x){ if(x.id === id) L = x; });

  var need = [], cost = 0;
  Object.keys(L.it).forEach(function(cat){

    if(!item) return;
    if(S.owned.indexOf(iid) < 0 && item.pr > 0){ need.push([cat, iid, item]); cost += item.pr; }

  if(need.length){

    need.forEach(function(x){ S.owned.push(x[1]); });

/* ---------- 4) Stiller ---------- */
function p20_css(){
  if(document.getElementById('p20css')) return;
  const st=document.createElement('style'); st.id='p20css';
  st.textContent = `
  .p20-marka{margin:18px auto 8px;padding:12px 14px;border-top:1px solid var(--card-brd);
    display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
    color:var(--tx2);font-size:.82rem;text-align:center}
  .p20-marka img{width:30px;height:30px;display:block;filter:drop-shadow(0 3px 8px rgba(0,0,0,.28))}
  .p20-marka b{color:var(--tx1,#e8e8f5);font-weight:800;letter-spacing:.4px}
  .p20-marka .r{font-size:.62em;vertical-align:super;opacity:.85}
  .p20-marka .ayrac{opacity:.35}
  .p20-devtab{border:1px dashed var(--card-brd)}
  .p20-devtab .tb-emo{filter:drop-shadow(0 0 6px rgba(124,92,255,.55))}
  /* geliştirici ekranı */
  .p20-okul{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--card-brd);
    border-radius:var(--r);background:linear-gradient(180deg,rgba(255,255,255,.05),transparent);margin:10px 0 14px}

/* ---------- 8) GÖRSEL YÜKLEME: okul logosunu değiştir (Ayarlar → Yedeği geri yükle) ---------- */
const ImgBil={
  MAX: 3*1024*1024,
  canHandle(type,size){
    if(!/^image\/(png|jpeg|jpg|webp|gif|bmp)$/i.test(type||'')){ toast('⚠️','Bu dosya görsel değil','Desteklenen: png, jpg, webp, gif, bmp.','warn',3800); return false; }
    if(size>ImgBil.MAX){ toast('⚠️','Görsel çok büyük',(size/1048576).toFixed(1)+' MB · en fazla 3 MB olabilir.','warn',4200); return false; }
    return true;
  },
  read(type,size,dataUrl){
    const img=new Image();
    img.onload=()=>{
      try{
        const max=256, k=Math.min(1, max/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*k)), h=Math.max(1,Math.round(img.height*k));
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        const x=c.getContext('2d'); x.clearRect(0,0,w,h); x.drawImage(img,0,0,w,h);
        let out=null; try{ out=c.toDataURL('image/png'); }catch(e){ out=dataUrl; }
        ImgBil.sor(out, type, size);
      }catch(e){ toast('⚠️','Görsel işlenemedi',String(e&&e.message||e),'warn',4200); }
    };
    img.onerror=()=>toast('⚠️','Görsel açılamadı','Dosya bozuk olabilir.','warn',3600);
    img.src=dataUrl;
  },
  sor(out,type,size){
    showModal(`<h2>🖼️ Görsel yüklendi</h2>
      <p class="muted tiny">${(size/1024).toFixed(0)} KB · ${String(type||'').replace('image/','').toUpperCase()} · otomatik olarak 256 px’e küçültüldü (${Math.round(out.length/1365)} KB).</p>
      <div style="display:flex;justify-content:center;margin:10px 0"><img src="${out}" alt="Seçilen görsel" style="width:120px;height:120px;object-fit:contain;background:#fff;border:1px solid var(--card-brd);border-radius:14px;padding:6px"></div>
      <p class="tiny muted">Bunu <b>okul logosu</b> olarak kullanmak ister misin? Uygulamanın alt bilgisinde ve geliştirici ekranında görünür.</p>
      <div class="btnrow end mt">
        <button class="btn ghost" onclick="closeModal()">Vazgeç</button>
        <button class="btn primary" onclick="ImgBil.uygula('__OUT__')">✅ Okul logosu yap</button></div>`);
    ImgBil._out=out;
    try{ const b=document.querySelector('#modal .btn.primary'); if(b) b.setAttribute('onclick','ImgBil.uygulaP()'); }catch(e){}
  },
  uygulaP(){ ImgBil.uygula(ImgBil._out); },
  uygula(out){
    try{ S.brandLogo=String(out||''); save(); }catch(e){}
    closeModal(); p20_marka(true);
    toast('✅','Logo güncellendi','Alt bilgide ve geliştirici ekranında yeni görsel kullanılıyor.','good',4200);
  },
  sifirla(){
    try{ delete S.brandLogo; save(); }catch(e){}
    closeModal(); p20_marka(true);
    toast('↺','Varsayılan logo','BİL KOLEJİ logosu geri getirildi.','',3200);
  }
};
